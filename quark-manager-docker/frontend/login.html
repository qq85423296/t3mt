<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - T3MT</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            width: 380px;
            padding: 40px;
        }
        .login-title {
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 32px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-input:focus {
            outline: none;
            border-color: #1890ff;
            background: #fff;
        }
        .login-button {
            width: 100%;
            padding: 11px;
            background: #1890ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .login-button:hover {
            background: #40a9ff;
        }
        .login-button:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        .tips {
            margin-top: 16px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        .error-message {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">夸克网盘管理工具</h1>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <button type="submit" class="login-button" id="loginBtn">登录</button>
        </form>
        <div class="tips">默认账号：admin / admin123</div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        // 处理登录
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            // 禁用按钮
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            hideError();

            try {
                const result = await AuthAPI.login(username, password);

                if (result.code === 200) {
                    Message.success('登录成功');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    showError(result.message || '登录失败');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                console.error('登录失败:', error);
                showError('登录失败，请检查网络连接');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        // 回车登录
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !loginBtn.disabled) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
