<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许可证管理</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .license-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .license-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .license-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .license-type {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .license-type.community {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .license-type.pro {
            background: #fff3e0;
            color: #e65100;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .feature-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
        }

        .feature-item.limited {
            border-left-color: #ff9800;
        }

        .feature-item.locked {
            border-left-color: #f44336;
            opacity: 0.7;
        }

        .feature-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .feature-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .feature-value.unlimited {
            color: #4CAF50;
        }

        .machine-id-box {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 6px;
            margin: 16px 0;
        }

        .machine-id-text {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #333;
            word-break: break-all;
            user-select: all;
        }

        .activation-form {
            margin-top: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #0b7dda;
        }

        .upgrade-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .upgrade-banner h2 {
            margin: 0 0 12px 0;
            font-size: 24px;
        }

        .upgrade-banner p {
            margin: 0 0 16px 0;
            opacity: 0.9;
        }

        .upgrade-banner .btn {
            background: white;
            color: #667eea;
            padding: 12px 32px;
            font-size: 16px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .comparison-table th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .comparison-table .check {
            color: #4CAF50;
            font-weight: bold;
        }

        .comparison-table .cross {
            color: #f44336;
            font-weight: bold;
        }

        .usage-stats {
            display: flex;
            gap: 16px;
            margin: 16px 0;
        }

        .usage-item {
            flex: 1;
            padding: 16px;
            background: #e3f2fd;
            border-radius: 6px;
            text-align: center;
        }

        .usage-item.warning {
            background: #fff3e0;
        }

        .usage-item.danger {
            background: #ffebee;
        }

        .usage-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .usage-value {
            font-size: 24px;
            font-weight: bold;
            color: #1976d2;
        }

        .usage-item.warning .usage-value {
            color: #f57c00;
        }

        .usage-item.danger .usage-value {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="license-container">
        <h1>许可证管理</h1>

        <!-- 试用版横幅 -->
        <div id="trialBanner" class="upgrade-banner" style="display: none; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <h2>🎉 试用版已激活</h2>
            <p id="trialMessage">您正在使用7天试用版，享受付费版全部功能</p>
            <button class="btn" onclick="showActivationForm()">购买正式版</button>
        </div>

        <!-- 升级横幅（仅社区版显示） -->
        <div id="upgradeBanner" class="upgrade-banner" style="display: none;">
            <h2>🚀 升级到付费版，解锁全部功能</h2>
            <p>无限账号 · 无限任务 · 自定义接口 · 4K画质 · 更多解析次数</p>
            <button class="btn" onclick="showActivationForm()">立即激活</button>
        </div>

        <!-- 当前许可证信息 -->
        <div class="license-card">
            <div class="license-header">
                <div>
                    <h2 style="margin: 0 0 8px 0;">当前许可证</h2>
                    <span id="licenseType" class="license-type community">社区版</span>
                </div>
                <div id="expireInfo" style="text-align: right; color: #666;"></div>
            </div>

            <!-- 今日使用统计 -->
            <div class="usage-stats" id="usageStats">
                <div class="usage-item">
                    <div class="usage-label">今日解析次数</div>
                    <div class="usage-value"><span id="parseCount">0</span> / <span id="parseLimit">10</span></div>
                </div>
                <div class="usage-item">
                    <div class="usage-label">4K体验次数</div>
                    <div class="usage-value"><span id="quality4kCount">0</span> / <span id="quality4kLimit">3</span></div>
                </div>
            </div>

            <!-- 功能限制 -->
            <h3>功能限制</h3>
            <div class="feature-grid" id="featureGrid">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 版本对比 -->
        <div class="license-card">
            <h2>版本对比</h2>
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>功能</th>
                        <th>社区版</th>
                        <th>付费版</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>夸克账号数量</td>
                        <td>1个</td>
                        <td class="check">无限制</td>
                    </tr>
                    <tr>
                        <td>影视下载任务</td>
                        <td>3个</td>
                        <td class="check">无限制</td>
                    </tr>
                    <tr>
                        <td>自定义解析接口</td>
                        <td class="cross">✗</td>
                        <td class="check">✓</td>
                    </tr>
                    <tr>
                        <td>视频画质</td>
                        <td>360P（体验3次4K）</td>
                        <td class="check">4K/1080P/720P可选</td>
                    </tr>
                    <tr>
                        <td>每日解析次数</td>
                        <td>10次</td>
                        <td class="check">200次</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 机器码 -->
        <div class="license-card">
            <h2>机器码</h2>
            <p style="color: #666; margin-bottom: 12px;">购买许可证时需要提供此机器码</p>
            <div class="machine-id-box">
                <div class="machine-id-text" id="machineId">加载中...</div>
            </div>
            <button class="btn btn-secondary" onclick="copyMachineId()">复制机器码</button>
        </div>

        <!-- 激活许可证 -->
        <div class="license-card" id="activationCard">
            <h2>激活许可证</h2>
            <div class="activation-form">
                <div class="form-group">
                    <label for="licenseKey">许可证密钥</label>
                    <textarea id="licenseKey" placeholder="请粘贴您的许可证密钥"></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="activateLicense()">激活</button>
                    <button class="btn btn-secondary" onclick="verifyLicense()">验证</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        console.log('许可证页面脚本开始执行');
        console.log('API_BASE_URL:', typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'undefined');
        
        (function() {
            // 使用立即执行函数避免变量重复声明
            let currentLicenseInfo = null;
            let currentMachineId = null;

            // 页面加载时获取许可证信息
            function initPage() {
                console.log('开始初始化许可证页面');
                loadLicenseInfo();
                loadMachineId();
            }
            
            // 确保DOM加载完成后执行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initPage);
            } else {
                // DOM已经加载完成,直接执行
                initPage();
            }

            // 加载许可证信息
            async function loadLicenseInfo() {
                console.log('开始加载许可证信息');
                try {
                    const url = `${API_BASE_URL}/api/license/info`;
                    console.log('请求URL:', url);
                    
                    const response = await fetch(url, {
                        credentials: 'include'
                    });
                    console.log('响应状态:', response.status);
                    
                    const result = await response.json();
                    console.log('许可证信息:', result);

                    if (result.code === 200) {
                        currentLicenseInfo = result.data;
                        renderLicenseInfo(result.data);
                    } else {
                        showError('获取许可证信息失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('加载许可证信息失败:', error);
                    showError('获取许可证信息失败: ' + error.message);
                }
            }

            // 渲染许可证信息
            function renderLicenseInfo(data) {
                // 许可证类型
                const licenseTypeEl = document.getElementById('licenseType');
                const trialBanner = document.getElementById('trialBanner');
                const upgradeBanner = document.getElementById('upgradeBanner');
                
                if (data.license_type === 'trial') {
                    // 试用版
                    licenseTypeEl.textContent = '试用版';
                    licenseTypeEl.className = 'license-type pro';
                    trialBanner.style.display = 'block';
                    upgradeBanner.style.display = 'none';
                    
                    const daysRemaining = data.days_remaining || 0;
                    document.getElementById('trialMessage').textContent = 
                        `您正在使用试用版，剩余 ${daysRemaining} 天，享受付费版全部功能`;
                } else if (data.is_pro) {
                    // 付费版
                    licenseTypeEl.textContent = '付费版';
                    licenseTypeEl.className = 'license-type pro';
                    trialBanner.style.display = 'none';
                    upgradeBanner.style.display = 'none';
                } else {
                    // 社区版
                    licenseTypeEl.textContent = '社区版';
                    licenseTypeEl.className = 'license-type community';
                    trialBanner.style.display = 'none';
                    upgradeBanner.style.display = 'block';
                }

                // 过期时间
                const expireInfoEl = document.getElementById('expireInfo');
                if (data.expire_time) {
                    const expireDate = new Date(data.expire_time);
                    expireInfoEl.innerHTML = `<div style="font-size: 12px;">过期时间</div><div style="font-size: 16px; font-weight: bold;">${expireDate.toLocaleDateString()}</div>`;
                } else {
                    expireInfoEl.innerHTML = '';
                }

                // 今日使用统计
                const parseCount = data.today_usage.parse_count || 0;
                const parseLimit = data.features.daily_parse_limit;
                const quality4kCount = data.today_usage.quality_4k_count || 0;
                const quality4kLimit = data.features.video_quality_4k_trial;

                document.getElementById('parseCount').textContent = parseCount;
                document.getElementById('parseLimit').textContent = parseLimit === -1 ? '∞' : parseLimit;
                document.getElementById('quality4kCount').textContent = quality4kCount;
                document.getElementById('quality4kLimit').textContent = quality4kLimit === -1 ? '∞' : quality4kLimit;

                // 更新使用统计样式
                const usageItems = document.querySelectorAll('.usage-item');
                if (parseLimit !== -1 && parseCount >= parseLimit * 0.8) {
                    usageItems[0].classList.add(parseCount >= parseLimit ? 'danger' : 'warning');
                }
                if (quality4kLimit !== -1 && quality4kCount >= quality4kLimit * 0.8) {
                    usageItems[1].classList.add(quality4kCount >= quality4kLimit ? 'danger' : 'warning');
                }

                // 功能限制
                const features = data.features;
                const featureGrid = document.getElementById('featureGrid');
                featureGrid.innerHTML = `
                    <div class="feature-item ${features.max_accounts === -1 ? '' : 'limited'}">
                        <div class="feature-label">夸克账号数量</div>
                        <div class="feature-value ${features.max_accounts === -1 ? 'unlimited' : ''}">${features.max_accounts === -1 ? '无限制' : features.max_accounts + '个'}</div>
                    </div>
                    <div class="feature-item ${features.max_video_tasks === -1 ? '' : 'limited'}">
                        <div class="feature-label">影视下载任务</div>
                        <div class="feature-value ${features.max_video_tasks === -1 ? 'unlimited' : ''}">${features.max_video_tasks === -1 ? '无限制' : features.max_video_tasks + '个'}</div>
                    </div>
                    <div class="feature-item ${features.custom_parse_api ? '' : 'locked'}">
                        <div class="feature-label">自定义解析接口</div>
                        <div class="feature-value">${features.custom_parse_api ? '✓ 已解锁' : '✗ 未解锁'}</div>
                    </div>
                    <div class="feature-item ${features.video_quality === '4k' ? '' : 'limited'}">
                        <div class="feature-label">视频画质</div>
                        <div class="feature-value">${features.video_quality === '4k' ? '4K可选' : '360P'}</div>
                    </div>
                `;
            }

            // 加载机器码
            async function loadMachineId() {
                console.log('开始加载机器码');
                try {
                    const url = `${API_BASE_URL}/api/license/machine-id`;
                    console.log('请求URL:', url);
                    
                    const response = await fetch(url, {
                        credentials: 'include'
                    });
                    console.log('响应状态:', response.status);
                    
                    const result = await response.json();
                    console.log('机器码信息:', result);

                    if (result.code === 200) {
                        currentMachineId = result.data.machine_id;
                        document.getElementById('machineId').textContent = currentMachineId;
                        console.log('机器码已设置:', currentMachineId);
                    } else {
                        document.getElementById('machineId').textContent = '获取失败';
                        console.error('获取机器码失败:', result.message);
                    }
                } catch (error) {
                    console.error('加载机器码失败:', error);
                    document.getElementById('machineId').textContent = '获取失败';
                }
            }

            // 复制机器码
            window.copyMachineId = function() {
                if (!currentMachineId) {
                    showError('机器码未加载');
                    return;
                }

                navigator.clipboard.writeText(currentMachineId).then(() => {
                    showSuccess('机器码已复制到剪贴板');
                }).catch(() => {
                    showError('复制失败，请手动复制');
                });
            };

            // 显示激活表单
            window.showActivationForm = function() {
                document.getElementById('activationCard').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('licenseKey').focus();
            };

            // 激活许可证
            window.activateLicense = async function() {
                const licenseKey = document.getElementById('licenseKey').value.trim();

                if (!licenseKey) {
                    showError('请输入许可证密钥');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/license/activate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({ license_key: licenseKey })
                    });

                    const result = await response.json();

                    if (result.code === 200) {
                        showSuccess('许可证激活成功！');
                        document.getElementById('licenseKey').value = '';
                        setTimeout(() => {
                            loadLicenseInfo();
                        }, 1000);
                    } else {
                        showError('激活失败: ' + result.message);
                    }
                } catch (error) {
                    showError('激活失败: ' + error.message);
                }
            };

            // 验证许可证
            window.verifyLicense = async function() {
                const licenseKey = document.getElementById('licenseKey').value.trim();

                if (!licenseKey) {
                    showError('请输入许可证密钥');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/license/verify`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({ license_key: licenseKey })
                    });

                    const result = await response.json();

                    if (result.code === 200 && result.data.valid) {
                        const data = result.data;
                        const expireDate = new Date(data.expire_time).toLocaleDateString();
                        showSuccess(`许可证有效！\n类型: ${data.license_type === 'pro' ? '付费版' : '社区版'}\n过期时间: ${expireDate}`);
                    } else {
                        showError('许可证无效: ' + result.message);
                    }
                } catch (error) {
                    showError('验证失败: ' + error.message);
                }
            };

            // 显示成功消息
            function showSuccess(message) {
                alert('✓ ' + message);
            }

            // 显示错误消息
            function showError(message) {
                alert('✗ ' + message);
            }
        })(); // 立即执行函数结束
    </script>
</body>
</html>
