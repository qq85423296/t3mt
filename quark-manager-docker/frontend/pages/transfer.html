<script>
    // 动态加载Cron模态框HTML
    fetch('../components/cron-modal.html')
        .then(response => response.text())
        .then(html => {
            const container = document.getElementById('cronModalContainer');
            if (container) {

            } else {
                console.error('cronModalContainer元素未找到');

        })
        .catch(error => console.error('加载Cron模态框失败:', error));
</script>

<script>
(function() {
    // 使用IIFE避免全局变量污染
    let currentTaskId = null;
    let accountList = [];

    // 加载任务列表
    async function loadTasks() {
        const tbody = document.getElementById('taskList');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;"><div class="loading">加载中...</div></td></tr>';

        try {
            const result = await TransferAPI.getList();
            
            if (result.code === 200 && result.data) {
                displayTasks(result.data);
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">加载失败</td></tr>';
            }
        } catch (error) {
            console.error('加载任务列表失败:', error);
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">加载失败</td></tr>';
        }
    }

    // 显示任务列表
    function displayTasks(tasks) {
        const tbody = document.getElementById('taskList');
        
        if (!tasks || tasks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">暂无任务</td></tr>';
            return;
        }

        tbody.innerHTML = tasks.map(task => {
            const urls = Array.isArray(task.share_urls) ? task.share_urls : [];
            
            // 构建分享链接显示（包含状态和截断）
            const urlsHtml = urls.slice(0, 2).map(u => {
                const url = u.url || u;
                const status = u.status || '未检查';
                const statusClass = status === '正常' ? 'badge-success' : 
                                  status === '未检查' ? 'badge-warning' : 'badge-error';
                
                return `
                    <div class="source-url-wrapper">
                        <div class="tooltip-wrapper">
                            <a href="${url}" target="_blank" class="source-url-link">${url}</a>
                            <span class="tooltip-text">${url}</span>
                        </div>
                        <span class="badge ${statusClass}">${status}</span>
                    </div>
                `;
            }).join('');
            const moreUrls = urls.length > 2 ? `<div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">...等${urls.length}个链接</div>` : '';
            
            const statusClass = task.status === 'running' ? 'badge-success' : 
                              task.status === 'paused' ? 'badge-warning' : 'badge-error';
            const statusText = task.status === 'running' ? '运行中' : 
                             task.status === 'paused' ? '已暂停' : '已失效';
            
            // 构建完整的转存路径
            let fullTargetPath = task.target_path;
            if (task.save_mode === 'subfolder' && task.target_folder_name) {
                fullTargetPath = `${task.target_path.replace(/\/$/, '')}/${task.target_folder_name}`;
            }
            
            // 构建账号显示：夸克名称(备注)
            let accountDisplay = '-';
            if (task.account_name && task.account_remark) {
                accountDisplay = `${task.account_name}(${task.account_remark})`;
            } else if (task.account_remark) {
                accountDisplay = task.account_remark;
            } else if (task.account_name) {
                accountDisplay = task.account_name;
            }
            
            return `
                <tr>
                    <td>${task.name}</td>
                    <td class="source-url-cell">${urlsHtml}${moreUrls}</td>
                    <td>${accountDisplay} - ${fullTargetPath}</td>
                    <td>${CronConfig.parseCronExpression(task.cron_expression)}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-small" onclick="checkShareStatus(${task.id})">检查</button>
                            <button class="btn-small" onclick="executeTask(${task.id})">执行</button>
                            <button class="btn-small" onclick="editTask(${task.id})">编辑</button>
                            <div class="more-actions">
                                <button class="more-actions-btn" onclick="toggleMoreActions(event, ${task.id})">⋯</button>
                                <div class="more-actions-menu" id="moreMenu${task.id}">
                                    <button onclick="toggleTask(${task.id})">${task.status === 'running' ? '暂停任务' : '启动任务'}</button>
                                    <button class="danger" onclick="deleteTask(${task.id})">删除任务</button>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    // 切换更多操作菜单

    async function browseShareFiles(btn) {
        const urlInput = btn.parentElement.querySelector('.share-url-input');
        const shareUrl = urlInput.value.trim();
        
        if (!shareUrl) {
            Message.warning('请先输入分享链接');

        const accountId = document.getElementById('targetAccount').value;

    async function loadShareFiles(shareUrl, accountId, pdirFid) {
        const listContainer = document.getElementById('shareFileList');
        listContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">加载中...</div>';
        
        try {
            const result = await TransferAPI.browseShare({
                url: shareUrl,
                account_id: parseInt(accountId),
                pdir_fid: pdirFid
            });
            
            if (result.code === 200) {
                currentShareData = result.data;
                renderShareFileList(result.data.files, pdirFid);
            } else {
                listContainer.innerHTML = `<div style="text-align: center; padding: 40px; color: #f56c6c;">${result.message}</div>`;
            }
        } catch (error) {
            console.error('加载分享文件失败:', error);
            listContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #f56c6c;">加载失败</div>';
        }
    }
    
    function renderShareFileList(files, currentFid) {
        const listContainer = document.getElementById('shareFileList');
        
        if (!files || files.length === 0) {
            listContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">此目录为空</div>';
            return;
        }
        
        let html = '<table class="data-table" style="width: 100%;"><thead><tr><th>文件名</th><th width="100">大小</th><th width="80">操作</th></tr></thead><tbody>';
        
        // 添加返回上级目录（如果不是根目录）
        if (currentFid !== '0') {
            html += `
                <tr>
                    <td colspan="3" style="cursor: pointer; color: #1890ff;" onclick="goBackShareDir()">
                        📁 .. (返回上级)
                    </td>
                </tr>
            `;
        }
        
        // 文件夹优先
        const folders = files.filter(f => f.dir);
        const regularFiles = files.filter(f => !f.dir);
        
        [...folders, ...regularFiles].forEach(file => {
            const icon = file.dir ? '📁' : '📄';
            const size = file.dir ? '-' : formatFileSize(file.size);
            const action = file.dir 
                ? `<button class="btn btn-small" onclick="enterShareDir('${file.fid}', '${file.file_name}')">打开</button>`
                : '-';
            
            html += `
                <tr>
                    <td>${icon} ${file.file_name}</td>
                    <td>${size}</td>
                    <td>${action}</td>
                </tr>
            `;
        });
        
        html += '</tbody></table>';
        listContainer.innerHTML = html;
    }
    
    const shareDirStack = [{ fid: '0', name: '/' }];
    
    function enterShareDir(fid, name) {
        shareDirStack.push({ fid, name });
        updateSharePath();
        
        const urlInput = currentBrowseButton.parentElement.querySelector('.share-url-input');
        const accountId = document.getElementById('targetAccount').value;
        loadShareFiles(urlInput.value.trim(), accountId, fid);
    }
    
    function goBackShareDir() {
        if (shareDirStack.length > 1) {
            shareDirStack.pop();
            updateSharePath();
            
            const currentDir = shareDirStack[shareDirStack.length - 1];
            const urlInput = currentBrowseButton.parentElement.querySelector('.share-url-input');
            const accountId = document.getElementById('targetAccount').value;
            loadShareFiles(urlInput.value.trim(), accountId, currentDir.fid);
        }
    }
    
    function updateSharePath() {
        const pathStr = shareDirStack.map(d => d.name).join('/').replace('//', '/');
        document.getElementById('currentSharePath').textContent = pathStr || '/';
    }
    
    function confirmSharePath() {
        if (currentBrowseButton) {
            const urlInput = currentBrowseButton.parentElement.querySelector('.share-url-input');
            const pathInput = currentBrowseButton.parentElement.querySelector('.share-source-path');
            const pathStr = shareDirStack.map(d => d.name).join('/').replace('//', '/');
            const currentDir = shareDirStack[shareDirStack.length - 1];
            
            // 保存路径
            pathInput.value = pathStr || '/';
            
            // 如果选择了子目录，更新分享链接，添加文件夹ID
            if (currentDir.fid !== '0') {
                const originalUrl = urlInput.value.trim();
                // 移除可能已存在的hash部分
                const baseUrl = originalUrl.split('#')[0].split('?')[0];
                // 添加新的hash格式：#/list/share/文件夹ID
                urlInput.value = `${baseUrl}#/list/share/${currentDir.fid}`;
                Message.success(`已选择路径: ${pathStr}，链接已更新`);
            } else {
                // 如果是根目录，移除hash部分
                const originalUrl = urlInput.value.trim();
                const baseUrl = originalUrl.split('#')[0].split('?')[0];
                urlInput.value = baseUrl;
                Message.success(`已选择根目录`);
            }
        }
        
        closeBrowseShareModal();
    }
    
    function closeBrowseShareModal() {
        const modal = document.getElementById('browseShareModal');
        modal.classList.remove('show');
        shareDirStack.length = 1; // 重置为根目录
        currentBrowseButton = null;
        currentShareData = null;
    }
    
    // 格式化文件大小
    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    // 渲染配置区域
    function renderCronConfig(dimension) {

            <!-- 周期范围模式 -->
            <div class="cron-mode-radio">
                <input type="radio" name="cronMode" value="range" id="mode_range"

                       onchange="setCronMode('${dimension}', 'range')" />

                           value="${config.rangeEnd}" min="${dimConfig.min}" max="${dimConfig.max}"
                           onchange="updateCronRange('${dimension}', 'end', this.value)" />

            <div class="cron-mode-radio">

                       ${config.mode === 'interval' ? 'checked' : ''} 
                       onchange="setCronMode('${dimension}', 'interval')" />
                <label for="mode_interval">从</label>
            </div>
            <div class="cron-mode-content" style="display: ${config.mode === 'interval' ? 'block' : 'none'};" id="interval_content">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" class="form-input" style="width: 80px;" 
                           value="${config.intervalStart}" min="${dimConfig.min}" max="${dimConfig.max}"
                           onchange="updateCronInterval('${dimension}', 'start', this.value)" />
                    <span>${dimConfig.label}开始，每</span>
                    <input type="number" class="form-input" style="width: 80px;" 
                           value="${config.intervalStep}" min="1" max="${dimConfig.max}"
                           onchange="updateCronInterval('${dimension}', 'step', this.value)" />
                    <span>${dimConfig.label}执行一次</span>
                </div>
            </div>
            
            <!-- 指定值模式 -->
            <div class="cron-mode-radio">
                <input type="radio" name="cronMode" value="specific" id="mode_specific" 
                       ${config.mode === 'specific' ? 'checked' : ''} 
                       onchange="setCronMode('${dimension}', 'specific')" />
                <label for="mode_specific">指定</label>
            </div>
            <div class="cron-mode-content" style="display: ${config.mode === 'specific' ? 'block' : 'none'};" id="specific_content">
                <div class="cron-number-grid">
                    ${generateNumberButtons(dimension, config.specificValues)}

    // 生成数字按钮
    function generateNumberButtons(dimension, selectedValues) {
        const dimConfig = dimensionConfig[dimension];
        const buttons = [];
        
        for (let i = dimConfig.min; i <= dimConfig.max; i++) {
            const isSelected = selectedValues.includes(i);
            const label = dimConfig.labels ? dimConfig.labels[i] : i;
            buttons.push(`
                <button class="cron-number-btn ${isSelected ? 'selected' : ''}" 
                        onclick="toggleCronNumber('${dimension}', ${i})">
                    ${label}
                </button>
            `);
        }
        
        return buttons.join('');
    }

    // 设置配置模式
    function setCronMode(dimension, mode) {
        cronState.dimensionConfigs[dimension].mode = mode;
        
        // 显示/隐藏对应的内容区域
        document.getElementById('range_content').style.display = mode === 'range' ? 'block' : 'none';
        document.getElementById('interval_content').style.display = mode === 'interval' ? 'block' : 'none';
        document.getElementById('specific_content').style.display = mode === 'specific' ? 'block' : 'none';
        
        updateCronExpression(dimension);
    }

    // 更新周期范围
    function updateCronRange(dimension, type, value) {
        const config = cronState.dimensionConfigs[dimension];
        if (type === 'start') {
            config.rangeStart = parseInt(value);
        } else {
            config.rangeEnd = parseInt(value);
        }
        updateCronExpression(dimension);
    }

    // 更新固定间隔
    function updateCronInterval(dimension, type, value) {
        const config = cronState.dimensionConfigs[dimension];
        if (type === 'start') {
            config.intervalStart = parseInt(value);
        } else {
            config.intervalStep = parseInt(value);
        }
        updateCronExpression(dimension);
    }

    // 切换数字选择
    function toggleCronNumber(dimension, number) {
        const config = cronState.dimensionConfigs[dimension];
        const index = config.specificValues.indexOf(number);
        
        if (index > -1) {
            config.specificValues.splice(index, 1);
        } else {
            config.specificValues.push(number);
        }
        
        // 更新按钮状态
        const btn = event.target;
        btn.classList.toggle('selected');
        
        updateCronExpression(dimension);
    }

    // 更新Cron表达式
    function updateCronExpression(dimension) {
        const config = cronState.dimensionConfigs[dimension];
        let value = '*';
        
        switch (config.mode) {
            case 'wildcard':
                value = '*';
                break;
            case 'range':
                value = `${config.rangeStart}-${config.rangeEnd}`;
                break;
            case 'interval':
                value = `${config.intervalStart}/${config.intervalStep}`;
                break;
            case 'specific':
                if (config.specificValues.length > 0) {
                    value = config.specificValues.sort((a, b) => a - b).join(',');
                } else {
                    value = '*';
                }
                break;
        }
        
        cronState[dimension] = value;
        
        // 日和周互斥
        if (dimension === 'day' && value !== '*') {
            cronState.week = '?';
        } else if (dimension === 'week' && value !== '*') {
            cronState.day = '?';
        }
        
        updateCronPreview();
    }

    // 计算下次执行时间（核心修复：补全日/月/周校验、处理无效日期、统一7字段格式）
    function calculateNextExecutions(cronExpression, count) {
        const times = [];
        let cronParts = cronExpression.trim().split(/\s+/);
        let second, minute, hour, day, month, week, year;
        
        // 统一转换为7字段格式（秒 分 时 日 月 周 年），兼容5字段格式
        if (cronParts.length === 7) {
            [second, minute, hour, day, month, week, year] = cronParts;
        } else if (cronParts.length === 5) {
            second = '0';
            [minute, hour, day, month, week] = cronParts;
            year = '*';
        } else {
            throw new Error(`无效的Cron表达式格式：需5或7个字段，当前${cronParts.length}个`);
        }
        
        // 解析各字段有效值（带边界校验）
        const seconds = parseCronField(second, 0, 59);
        const minutes = parseCronField(minute, 0, 59);
        const hours = parseCronField(hour, 0, 23);
        const months = parseCronField(month, 1, 12); // 月份1-12（对应Date的0-11，后续转换）
        const days = parseCronField(day, 1, 31);     // 日期1-31
        const weeks = parseCronField(week, 0, 6);    // 星期0-6（0=周日，1=周一...6=周六）
        const years = parseCronField(year, 1970, 2100); // 年份范围
        
        // 从当前时间开始，初始化查找时间
        const now = new Date();
        let current = new Date(now);
        current.setMilliseconds(0);
        // 若当前秒数已过，先跳到下一秒，避免重复计算当前分钟
        if (current.getSeconds() < 59) {
            current.setSeconds(current.getSeconds() + 1);
        } else {
            current.setMinutes(current.getMinutes() + 1);
            current.setSeconds(0);
        }
        
        let found = 0;
        const maxIterations = 10000; // 防止死循环
        let iterations = 0;
        
        while (found < count && iterations < maxIterations) {
            iterations++;
            const currentYear = current.getFullYear();
            const currentMonth = current.getMonth() + 1; // 转换为1-12
            const currentDate = current.getDate();
            const currentWeekDay = current.getDay(); // 0=周日，1=周一...6=周六
            const currentHour = current.getHours();
            const currentMinute = current.getMinutes();
            const currentSecond = current.getSeconds();
            
            // 1. 校验年份
            if (!years.includes(currentYear)) {
                // 跳到下一年的1月1日0点0分0秒
                current.setFullYear(currentYear + 1);
                current.setMonth(0);
                current.setDate(1);
                current.setHours(0);
                current.setMinutes(0);
                current.setSeconds(0);
                continue;
            }
            
            // 2. 校验月份
            if (!months.includes(currentMonth)) {
                // 跳到下一个月的1日0点0分0秒
                if (currentMonth === 12) {
                    current.setFullYear(currentYear + 1);
                    current.setMonth(0);
                } else {
                    current.setMonth(current.getMonth() + 1);
                }
                current.setDate(1);
                current.setHours(0);
                current.setMinutes(0);
                current.setSeconds(0);
                continue;
            }
            
            // 3. 校验日期（处理日和周互斥：周不是?/*时，优先校验周；否则校验日）
            let dateValid = false;
            // 周有效（非?/*），优先校验星期
            if (week !== '?' && week !== '*') {
                if (weeks.includes(currentWeekDay)) {
                    dateValid = true;
                }
            } else {
                // 周无效，校验日期（同时处理当月最大天数，避免2月30日等无效日期）
                const maxDayOfMonth = new Date(currentYear, currentMonth, 0).getDate();
                const validDate = currentDate <= maxDayOfMonth && days.includes(currentDate);
                if (validDate) {
                    dateValid = true;
                }
            }
            if (!dateValid) {
                // 跳到下一天0点0分0秒
                current.setDate(currentDate + 1);
                current.setHours(0);
                current.setMinutes(0);
                current.setSeconds(0);
                continue;
            }
            
            // 4. 校验小时
            if (!hours.includes(currentHour)) {
                // 找到下一个匹配的小时
                let nextHour = null;
                for (const h of hours) {
                    if (h > currentHour) {
                        nextHour = h;
                        break;
                    }
                }
                
                if (nextHour !== null) {
                    // 今天还有匹配的小时
                    current.setHours(nextHour);
                } else {
                    // 今天没有匹配的小时了，跳到明天的第一个匹配小时
                    current.setDate(currentDate + 1);
                    current.setHours(Math.min(...hours));
                }
                current.setMinutes(0);
                current.setSeconds(0);
                continue;
            }
            
            // 5. 校验分钟
            if (!minutes.includes(currentMinute)) {
                // 找到下一个匹配的分钟
                let nextMinute = null;
                for (const m of minutes) {
                    if (m > currentMinute) {
                        nextMinute = m;
                        break;
                    }
                }
                
                if (nextMinute !== null) {
                    // 当前小时还有匹配的分钟
                    current.setMinutes(nextMinute);
                } else {
                    // 当前小时没有匹配的分钟了，跳到下一个匹配的小时
                    let nextHour = null;
                    for (const h of hours) {
                        if (h > currentHour) {
                            nextHour = h;
                            break;
                        }
                    }
                    
                    if (nextHour !== null) {
                        // 今天还有匹配的小时
                        current.setHours(nextHour);
                    } else {
                        // 今天没有匹配的小时了，跳到明天的第一个匹配小时
                        current.setDate(currentDate + 1);
                        current.setHours(Math.min(...hours));
                    }
                    current.setMinutes(Math.min(...minutes));
                }
                current.setSeconds(0);
                continue;
            }
            
            // 6. 校验秒数
            if (seconds.includes(currentSecond)) {
                // 所有条件满足，记录时间
                times.push(formatDateTime(new Date(current)));
                found++;
                
                // 找到下一个匹配的秒数
                let nextSecond = null;
                for (const s of seconds) {
                    if (s > currentSecond) {
                        nextSecond = s;
                        break;
                    }
                }
                
                if (nextSecond !== null) {
                    // 当前分钟还有匹配的秒数
                    current.setSeconds(nextSecond);
                } else {
                    // 当前分钟没有匹配的秒数了，跳到下一个匹配的分钟
                    let nextMinute = null;
                    for (const m of minutes) {
                        if (m > currentMinute) {
                            nextMinute = m;
                            break;
                        }
                    }
                    
                    if (nextMinute !== null) {
                        // 当前小时还有匹配的分钟
                        current.setMinutes(nextMinute);
                        current.setSeconds(Math.min(...seconds));
                    } else {
                        // 当前小时没有匹配的分钟了，跳到下一个匹配的小时
                        let nextHour = null;
                        for (const h of hours) {
                            if (h > currentHour) {
                                nextHour = h;
                                break;
                            }
                        }
                        
                        if (nextHour !== null) {
                            // 今天还有匹配的小时
                            current.setHours(nextHour);
                        } else {
                            // 今天没有匹配的小时了，跳到明天的第一个匹配小时
                            current.setDate(currentDate + 1);
                            current.setHours(Math.min(...hours));
                        }
                        current.setMinutes(Math.min(...minutes));
                        current.setSeconds(Math.min(...seconds));
                    }
                }
                continue;
            }
            
            // 秒数不匹配，找下一个匹配的秒数
            let nextSecond = null;
            for (const s of seconds) {
                if (s > currentSecond) {
                    nextSecond = s;
                    break;
                }
            }
            
            if (nextSecond !== null) {
                current.setSeconds(nextSecond);
            } else {
                // 当前分钟没有匹配的秒数了，跳到下一分钟
                if (currentMinute === 59) {
                    if (currentHour === 23) {
                        current.setDate(currentDate + 1);
                        current.setHours(0);
                    } else {
                        current.setHours(currentHour + 1);
                    }
                    current.setMinutes(0);
                } else {
                    current.setMinutes(currentMinute + 1);
                }
                current.setSeconds(0);
            }
        }
        
        if (iterations >= maxIterations) {
            throw new Error('迭代次数超出上限，未找到足够的有效执行时间');
        }
        
        return times;
    }

    // 解析Cron表达式为可读描述（原代码缺失，导致页面报错）
    function parseCronExpression(cron) {
        if (!cron) return '未设置执行时间';
        try {
            return generateCronDescription(cron);
        } catch (e) {
            return cron || '无效表达式';
        }
    }

    // 解析Cron字段（修复：增加边界校验、空值处理、无效值过滤）
    function parseCronField(field, min, max) {
        const values = new Set(); // 使用Set避免重复值
        field = field.trim();
        
        // 通配符（* 或 ?，?仅用于日/周）
        if (field === '*' || field === '?') {
            for (let i = min; i <= max; i++) {
                values.add(i);
            }
            return Array.from(values);
        }
        
        // 间隔表达式（例如: 0/5、*/5、10/2）
        if (field.includes('/')) {
            const [startPart, stepPart] = field.split('/');
            const step = parseInt(stepPart);
            // 校验步长有效性
            if (isNaN(step) || step < 1) {
                throw new Error(`无效步长：${stepPart}`);
            }
            // 确定起始值
            let start = min;
            if (startPart !== '*') {
                start = parseInt(startPart);
                if (isNaN(start) || start < min || start > max) {
                    throw new Error(`起始值超出范围：${startPart}（应在${min}-${max}之间）`);
                }
            }
            // 生成间隔值
            for (let i = start; i <= max; i += step) {
                values.add(i);
            }
            return Array.from(values);
        }
        
        // 范围表达式（例如: 1-5、10-20）
        if (field.includes('-')) {
            const [startPart, endPart] = field.split('-');
            const start = parseInt(startPart);
            const end = parseInt(endPart);
            // 校验范围有效性
            if (isNaN(start) || isNaN(end) || start > end || start < min || end > max) {
                throw new Error(`无效范围：${field}（应在${min}-${max}之间，且起始≤结束）`);
            }
            for (let i = start; i <= end; i++) {
                values.add(i);
            }
            return Array.from(values);
        }
        
        // 列表表达式（例如: 1,3,5、0,15,30,45）
        if (field.includes(',')) {
            const parts = field.split(',');
            for (const part of parts) {
                const num = parseInt(part.trim());
                if (isNaN(num) || num < min || num > max) {
                    throw new Error(`无效列表项：${part}（应在${min}-${max}之间）`);
                }
                values.add(num);
            }
            return Array.from(values);
        }
        
        // 单个值
        const num = parseInt(field);
        if (isNaN(num) || num < min || num > max) {
            throw new Error(`无效值：${field}（应在${min}-${max}之间）`);
        }
        values.add(num);
        return Array.from(values);
    }

    // 格式化日期时间
    function formatDateTime(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const mi = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        
        return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss} (${yyyy}${mm}${dd})`;
    }

    // 重置Cron配置
    function resetCronConfig() {
        cronState.second = '0';
        cronState.minute = '*';
        cronState.hour = '*';
        cronState.day = '*';
        cronState.month = '*';
        cronState.week = '?';
        cronState.year = '*';
        
        Object.keys(cronState.dimensionConfigs).forEach(dim => {
            const config = dimensionConfig[dim];
            cronState.dimensionConfigs[dim] = {
                mode: 'wildcard',
                rangeStart: config.min,
                rangeEnd: config.min + 1,
                intervalStart: config.min,
                intervalStep: 1,
                specificValues: []
            };
        });
        
        switchCronDimension('hour');
        updateCronPreview();
    }

    // 解析Cron表达式到状态（优化：兼容5/7字段、增加有效性校验）
    function parseCronToState(cronExpression) {
        const parts = cronExpression.trim().split(/\s+/);
        // 重置状态
        cronState.second = '0';
        cronState.minute = '*';
        cronState.hour = '*';
        cronState.day = '*';
        cronState.month = '*';
        cronState.week = '?';
        cronState.year = '*';
        
        try {
            if (parts.length >= 7) {
                // 7字段: 秒 分钟 小时 日 月 周 年
                cronState.second = parts[0] || '0';
                cronState.minute = parts[1] || '*';
                cronState.hour = parts[2] || '*';
                cronState.day = parts[3] || '*';
                cronState.month = parts[4] || '*';
                cronState.week = parts[5] || '?';
                cronState.year = parts[6] || '*';
            } else if (parts.length >= 5) {
                // 5字段: 分钟 小时 日 月 周
                cronState.minute = parts[0] || '*';
                cronState.hour = parts[1] || '*';
                cronState.day = parts[2] || '*';
                cronState.month = parts[3] || '*';
                cronState.week = parts[4] || '?';
            }
            // 校验字段有效性，避免无效值存入状态
            parseCronField(cronState.second, 0, 59);
            parseCronField(cronState.minute, 0, 59);
            parseCronField(cronState.hour, 0, 23);
            parseCronField(cronState.day, 1, 31);
            parseCronField(cronState.month, 1, 12);
            parseCronField(cronState.week, 0, 6);
        } catch (e) {
            console.warn('Cron表达式解析到状态失败:', e.message);
        }
    }

    // 应用Cron表达式
    function applyCron() {

        const cron = `${cronState.second} ${cronState.minute} ${cronState.hour} ${cronState.day} ${cronState.month} ${cronState.week} ${cronState.year}`;
        
        document.getElementById('cronExpression').value = cron;

    // 生成Cron描述（优化：描述更准确、避免无效显示）
    function generateCronDescription(cron) {
        const parts = cron.trim().split(/\s+/);
        let second, minute, hour, day, month, week, year;
        
        // 统一转换为7字段
        if (parts.length >= 7) {
            [second, minute, hour, day, month, week, year] = parts;
        } else if (parts.length >= 5) {
            second = '0';
            [minute, hour, day, month, week] = parts;
            year = '*';
        } else {
            return '无效的Cron表达式';
        }
        
        // 简化描述逻辑，提升准确性
        const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        
        // 每分钟执行
        if (minute === '*' && hour === '*' && day === '*' && month === '*' && week === '?') {
            return '每分钟执行一次';
        }
        
        // 每N分钟执行
        if (minute.includes('/') && hour === '*' && day === '*' && month === '*' && week === '?') {
            const interval = minute.split('/')[1];
            return `每${interval}分钟执行一次`;
        }
        
        // 每N小时执行（指定分钟）
        if (hour.includes('/') && day === '*' && month === '*' && week === '?') {
            const interval = hour.split('/')[1];
            const minStr = minute === '*' ? '0' : minute;
            return `每${interval}小时的第${minStr}分钟执行`;
        }
        
        // 每天指定时间执行
        if (day === '*' && month === '*' && week === '?' && hour !== '*' && minute !== '*') {
            const hourStr = hour.split(',').map(h => h.padStart(2, '0')).join('、');
            const minStr = minute.split(',').map(m => m.padStart(2, '0')).join('、');
            return `每天 ${hourStr}:${minStr} 执行`;
        }
        
        // 每周指定时间执行
        if (week !== '?' && week !== '*' && month === '*') {
            const weekStr = week.split(',').map(w => weekNames[parseInt(w)]).join('、');
            const hourStr = hour !== '*' ? hour.padStart(2, '0') : '0';
            const minStr = minute !== '*' ? minute.padStart(2, '0') : '0';
            return `每周 ${weekStr} ${hourStr}:${minStr} 执行`;
        }
        
        // 每月指定日期执行
        if (day !== '*' && day !== '?' && week === '?' && month === '*') {
            const dayStr = day.split(',').join('、');
            const hourStr = hour !== '*' ? hour.padStart(2, '0') : '0';
            const minStr = minute !== '*' ? minute.padStart(2, '0') : '0';
            return `每月 ${dayStr} 日 ${hourStr}:${minStr} 执行`;
        }
        
        // 自定义时间（无法简化描述时，显示原表达式）
        return cron.length > 50 ? `${cron.slice(0, 50)}...` : cron;
    }

    // 保存任务
    async function saveTask() {
        const name = document.getElementById('taskName').value.trim();
        
        // 获取分享链接和源路径
        const shareUrlItems = Array.from(document.querySelectorAll('#shareUrls .share-url-item'));
        const shareUrls = shareUrlItems.map(item => {
            const url = item.querySelector('.share-url-input').value.trim();
            const sourcePath = item.querySelector('.share-source-path').value || '/';
            return url ? { url, source_path: sourcePath, is_primary: false } : null;
        }).filter(item => item);
        
        const targetAccountId = document.getElementById('targetAccount').value;
        const targetPath = document.getElementById('targetPath').value.trim();
        const cronExpression = document.getElementById('cronExpression').value;

        // 验证必填项
        if (!name) {
            Message.warning('请输入任务名称');
            return;
        }
        if (shareUrls.length === 0) {
            Message.warning('请输入至少一个分享链接');
            return;
        }
        if (!targetAccountId) {
            Message.warning('请选择转存账号');
            return;
        }
        if (!targetPath) {
            Message.warning('请输入转存目录');
            return;
        }
        if (!cronExpression) {
            Message.warning('请设置执行时间');
            return;
        }

        // 获取保存模式和子文件夹名称（增加安全检查）
        const saveModeElement = document.querySelector('input[name="saveMode"]:checked');
        const saveMode = saveModeElement ? saveModeElement.value : 'current';
        
        const targetFolderNameElement = document.getElementById('targetFolderName');
        const targetFolderName = targetFolderNameElement ? targetFolderNameElement.value.trim() : '';
        
        // 如果选择了子文件夹模式但没有输入名称，提示用户
        if (saveMode === 'subfolder' && !targetFolderName) {
            Message.warning('请输入子文件夹名称');
            return;
        }

        const taskData = {
            name,
            share_urls: shareUrls,
            target_account_id: parseInt(targetAccountId),
            target_path: targetPath,
            save_mode: saveMode,
            target_folder_name: targetFolderName,
            filter_extensions: document.getElementById('filterExtensions').value.trim(),
            include_extensions: document.getElementById('includeExtensions').value.trim(),
            file_start_date: document.getElementById('fileStartDate').value || null,
            update_dirs: document.getElementById('updateDirs').value.trim(),
            overwrite_mode: document.getElementById('overwriteMode').checked ? 1 : 0,
            cron_expression: cronExpression,
            end_date: document.getElementById('endDate').value || null
        };

        try {
            let result;
            if (currentTaskId) {
                result = await TransferAPI.update(currentTaskId, taskData);
            } else {
                result = await TransferAPI.create(taskData);
            }
            
            if (result.code === 200) {
                Message.success(currentTaskId ? '任务更新成功' : '任务创建成功');
                hideTaskModal();
                loadTasks();
            } else {
                Message.error(result.message || '保存失败');
            }
        } catch (error) {
            console.error('保存任务失败:', error);
            Message.error('保存失败');
        }
    }

    // 编辑任务
    async function editTask(taskId) {
        try {
            const result = await TransferAPI.getDetail(taskId);
            
            if (result.code === 200 && result.data) {
                currentTaskId = taskId;
                fillTaskForm(result.data);
                document.getElementById('modalTitle').textContent = '编辑转存任务';
                document.getElementById('taskModal').classList.add('show');
            }
        } catch (error) {
            console.error('加载任务详情失败:', error);
            Message.error('加载任务详情失败');
        }
    }

    // 填充任务表单
    function fillTaskForm(task) {
        document.getElementById('taskName').value = task.name;
        
        const urls = Array.isArray(task.share_urls) ? task.share_urls : [];
        const container = document.getElementById('shareUrls');
        
        // 如果没有URL，至少显示一个空的输入框
        if (urls.length === 0) {
            container.innerHTML = `
                <div class="share-url-item">
                    <input type="text" class="form-input share-url-input" placeholder="https://pan.quark.cn/s/xxx" />
                    <input type="hidden" class="share-source-path" value="/" />
                    <button class="btn btn-small" onclick="browseShareFiles(this)">浏览</button>
                    <button class="btn btn-small" onclick="addShareUrl()">+</button>
                </div>
            `;
        } else {
            container.innerHTML = urls.map((urlObj, index) => {
                const url = typeof urlObj === 'string' ? urlObj : urlObj.url;
                const sourcePath = typeof urlObj === 'object' ? (urlObj.source_path || '/') : '/';
                const isFirst = index === 0;
                return `
                    <div class="share-url-item">
                        <input type="text" class="form-input share-url-input" value="${url}" />
                        <input type="hidden" class="share-source-path" value="${sourcePath}" />
                        <button class="btn btn-small" onclick="browseShareFiles(this)">浏览</button>
                        <button class="btn btn-small ${isFirst ? '' : 'btn-danger'}" 
                                onclick="${isFirst ? 'addShareUrl()' : 'removeShareUrl(this)'}">
                            ${isFirst ? '+' : '-'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        document.getElementById('targetAccount').value = task.target_account_id;
        document.getElementById('targetPath').value = task.target_path;
        
        // 设置保存模式
        const saveMode = task.save_mode || 'current';
        const saveModeRadio = document.querySelector(`input[name="saveMode"][value="${saveMode}"]`);
        if (saveModeRadio) {
            saveModeRadio.checked = true;
        }
        
        // 设置子文件夹名称
        const targetFolderNameInput = document.getElementById('targetFolderName');
        if (targetFolderNameInput) {
            targetFolderNameInput.value = task.target_folder_name || '';
        }
        
        // 显示/隐藏子文件夹输入框（必须在设置单选按钮之后调用）
        const folderNameGroup = document.getElementById('folderNameGroup');
        if (folderNameGroup) {
            folderNameGroup.style.display = saveMode === 'subfolder' ? 'block' : 'none';
        }
        
        document.getElementById('filterExtensions').value = task.filter_extensions || '';
        document.getElementById('includeExtensions').value = task.include_extensions || '';
        document.getElementById('fileStartDate').value = task.file_start_date || '';
        document.getElementById('updateDirs').value = task.update_dirs || '';
        document.getElementById('overwriteMode').checked = task.overwrite_mode === 1;
        document.getElementById('cronExpression').value = task.cron_expression;
        document.getElementById('cronDisplay').textContent = CronConfig.parseCronExpression(task.cron_expression);
        document.getElementById('endDate').value = task.end_date || '';
    }

    // 执行任务
    async function executeTask(taskId) {
        if (!confirm('确定要立即执行此任务吗？')) {
            return;
        }

        // 打开日志模态框
        const modal = document.getElementById('executeLogModal');
        const logContent = document.getElementById('executeLogContent');
        modal.classList.add('show');
        
        // 清空日志
        logContent.innerHTML = '<div style="color: #4ec9b0;">开始执行任务...</div>';
        
        // 添加日志函数
        const addLog = (message, type = 'info') => {
            const colors = {
                info: '#d4d4d4',
                success: '#4ec9b0',
                error: '#f48771',
                warning: '#dcdcaa'
            };
            const timestamp = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.style.color = colors[type];
            logLine.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(logLine);
            logContent.scrollTop = logContent.scrollHeight;
        };

        try {
            addLog('正在发送执行请求...', 'info');
            
            const result = await TransferAPI.execute(taskId);
            
            if (result.code === 200) {
                addLog('任务执行请求已发送', 'success');
                
                // 模拟实时日志（实际应该通过WebSocket或轮询获取）
                if (result.data && result.data.logs) {
                    result.data.logs.forEach(log => {
                        addLog(log.message, log.type || 'info');
                    });
                } else {
                    // 模拟执行过程
                    addLog('正在解析分享链接...', 'info');
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    addLog('正在获取文件列表...', 'info');
                    await new Promise(resolve => setTimeout(resolve, 800));
                    
                    addLog('正在转存文件...', 'info');
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    addLog('任务执行完成！', 'success');
                }
                
                Message.success('任务执行完成');
                loadTasks();
            } else {
                addLog(`执行失败: ${result.message}`, 'error');
                Message.error(result.message || '执行失败');
            }
        } catch (error) {
            console.error('执行任务失败:', error);
            addLog(`执行异常: ${error.message}`, 'error');
            Message.error('执行失败');
        }
    }
    
    // 检查分享链接状态
    async function checkShareStatus(taskId) {
        try {
            Message.info('正在检查分享链接状态...');
            
            const result = await TransferAPI.checkShares(taskId);
            
            if (result.code === 200) {
                Message.success('检查完成');
                loadTasks(); // 刷新任务列表
            } else {
                Message.error(result.message || '检查失败');
            }
        } catch (error) {
            console.error('检查分享链接状态失败:', error);
            Message.error('检查失败');
        }
    }
    
    // 关闭执行日志模态框
    function closeExecuteLogModal() {
        const modal = document.getElementById('executeLogModal');
        modal.classList.remove('show');
    }

    // 切换任务状态
    async function toggleTask(taskId) {
        try {
            const result = await TransferAPI.toggle(taskId);
            
            if (result.code === 200) {
                Message.success('操作成功');
                loadTasks();
            } else {
                Message.error(result.message || '操作失败');
            }
        } catch (error) {
            console.error('切换任务状态失败:', error);
            Message.error('操作失败');
        }
    }

    // 删除任务
    async function deleteTask(taskId) {
        if (!confirm('确定要删除此任务吗？')) {
            return;
        }

        try {
            const result = await TransferAPI.delete(taskId);
            
            if (result.code === 200) {
                Message.success('删除成功');
                loadTasks();
            } else {
                Message.error(result.message || '删除失败');
            }
        } catch (error) {
            console.error('删除任务失败:', error);
            Message.error('删除失败');
        }
    }

    // ========== 目录选择器相关 ==========
    let folderSelectorAccountId = null;
    let folderSelectorPath = [{ id: '0', name: '根目录' }];
    let selectedFolderId = '0';

    // 显示目录选择器
    async function showFolderSelector(accountId) {
        folderSelectorAccountId = accountId;
        folderSelectorPath = [{ id: '0', name: '根目录' }];
        selectedFolderId = '0';
        
        document.getElementById('selectedPath').value = '/';
        document.getElementById('folderSelectorModal').classList.add('show');
        
        await loadFolderList('0', '根目录');
    }

    // 隐藏目录选择器
    function hideFolderSelector() {
        document.getElementById('folderSelectorModal').classList.remove('show');
    }

    // 加载文件夹列表
    async function loadFolderList(folderId, folderName) {
        const tbody = document.getElementById('folderList');
        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 40px;"><div class="loading">加载中...</div></td></tr>';

        // 更新路径
        if (folderName) {
            const index = folderSelectorPath.findIndex(f => f.id === folderId);
            if (index !== -1) {
                folderSelectorPath = folderSelectorPath.slice(0, index + 1);
            } else if (folderId !== '0') {
                folderSelectorPath.push({ id: folderId, name: folderName });
            } else {
                folderSelectorPath = [{ id: '0', name: '根目录' }];
            }
        }
        
        selectedFolderId = folderId;
        updateFolderBreadcrumb();
        updateSelectedPath();

        try {
            const result = await QuarkAPI.getFiles(folderSelectorAccountId, folderId, 1, 100);
            
            if (result.code === 200 && result.data && result.data.items) {
                // 只显示文件夹
                const folders = result.data.items.filter(item => item.isFolder);
                displayFolders(folders);
            } else {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 40px; color: #999;">加载失败</td></tr>';
            }
        } catch (error) {
            console.error('加载文件夹列表失败:', error);
            tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 40px; color: #999;">加载失败</td></tr>';
        }
    }

    // 显示文件夹列表
    function displayFolders(folders) {
        const tbody = document.getElementById('folderList');
        
        if (!folders || folders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px; color: #999;">此目录下没有文件夹</td></tr>';
            return;
        }

        tbody.innerHTML = folders.map(folder => `
            <tr>
                <td>
                    <div class="file-name">
                        <span class="file-icon">📁</span>
                        <span>${folder.name}</span>
                    </div>
                </td>
                <td>
                    <button class="btn btn-small" onclick="loadFolderList('${folder.id}', '${folder.name.replace(/'/g, "\\'")}')">
                        进入
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // 更新文件夹面包屑
    function updateFolderBreadcrumb() {
        const breadcrumb = document.getElementById('folderBreadcrumb');
        breadcrumb.innerHTML = folderSelectorPath.map((folder, index) => {
            const isLast = index === folderSelectorPath.length - 1;
            return `
                <span class="breadcrumb-item" onclick="loadFolderList('${folder.id}', '${folder.name.replace(/'/g, "\\'")}')">${folder.name}</span>
                ${!isLast ? '<span class="breadcrumb-separator">/</span>' : ''}
            `;
        }).join('');
    }

    // 更新选择的路径
    function updateSelectedPath() {
        const path = folderSelectorPath.map(f => f.name).join('/').replace('根目录/', '/');
        document.getElementById('selectedPath').value = path === '根目录' ? '/' : path;
    }

    // 确认文件夹选择
    function confirmFolderSelection() {
        const path = document.getElementById('selectedPath').value;
        document.getElementById('targetPath').value = path;
        hideFolderSelector();
    }

    // 暴露需要在HTML中调用的函数到window对象
    window.showCreateTaskModal = showCreateTaskModal;
    window.hideTaskModal = hideTaskModal;
    window.toggleFolderName = toggleFolderName;
    window.addShareUrl = addShareUrl;
    window.removeShareUrl = removeShareUrl;
    window.browseShareFiles = browseShareFiles;
    window.enterShareDir = enterShareDir;
    window.goBackShareDir = goBackShareDir;
    window.confirmSharePath = confirmSharePath;
    window.closeBrowseShareModal = closeBrowseShareModal;
    window.selectTargetPath = selectTargetPath;
    window.showCronModal = showCronModal;
    window.hideCronModal = hideCronModal;
    window.switchCronDimension = switchCronDimension;
    window.setCronMode = setCronMode;
    window.updateCronRange = updateCronRange;
    window.updateCronInterval = updateCronInterval;
    window.toggleCronNumber = toggleCronNumber;
    window.previewNextExecutions = previewNextExecutions;
    window.resetCronConfig = resetCronConfig;
    window.applyCron = applyCron;
    window.saveTask = saveTask;
    window.editTask = editTask;
    window.executeTask = executeTask;
    window.checkShareStatus = checkShareStatus;
    window.closeExecuteLogModal = closeExecuteLogModal;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.toggleMoreActions = toggleMoreActions;
    window.loadFolderList = loadFolderList;
    window.hideFolderSelector = hideFolderSelector;
    window.confirmFolderSelection = confirmFolderSelection;

    // 初始化
    loadAccounts();
    loadTasks();
})();
</script>
