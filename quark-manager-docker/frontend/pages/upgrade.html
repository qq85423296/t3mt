<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统升级</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .upgrade-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .upgrade-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .upgrade-card h2 {
            margin: 0 0 16px 0;
            font-size: 18px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .version-info {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .version-item {
            flex: 1;
        }

        .version-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .version-value {
            font-size: 24px;
            font-weight: bold;
            color: #2563EB;
        }

        .update-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .update-banner h2 {
            margin: 0 0 12px 0;
            font-size: 24px;
            border: none;
            padding: 0;
            color: white;
        }

        .update-banner p {
            margin: 0 0 16px 0;
            opacity: 0.9;
        }

        .release-notes {
            background: rgba(255,255,255,0.2);
            padding: 16px;
            border-radius: 6px;
            margin: 16px 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #0b7dda;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #45a049 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .progress-message {
            margin-top: 12px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .backup-list {
            display: grid;
            gap: 12px;
        }

        .backup-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .backup-info {
            flex: 1;
        }

        .backup-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .backup-meta {
            font-size: 12px;
            color: #999;
        }

        .backup-actions {
            display: flex;
            gap: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="upgrade-container">
        <h1>系统升级</h1>

        <!-- 更新提示横幅 -->
        <div id="updateBanner" class="update-banner" style="display: none;">
            <h2>🎉 发现新版本</h2>
            <p id="updateMessage">新版本可用</p>
            <div id="releaseNotes" class="release-notes"></div>
            <button class="btn btn-primary" onclick="window.upgradeModule.startUpgrade()">立即升级</button>
        </div>

        <!-- 当前版本信息 -->
        <div class="upgrade-card">
            <h2>版本信息</h2>
            <div class="version-info">
                <div class="version-item">
                    <div class="version-label">当前版本</div>
                    <div class="version-value" id="currentVersion">-</div>
                </div>
                <div class="version-item">
                    <div class="version-label">最新版本</div>
                    <div class="version-value" id="latestVersion">-</div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="window.upgradeModule.checkUpdate()">检查更新</button>
        </div>

        <!-- 升级进度 -->
        <div id="upgradeProgress" class="upgrade-card" style="display: none;">
            <h2>升级进度</h2>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
                <div class="progress-message" id="progressMessage">准备中...</div>
            </div>
        </div>

        <!-- 备份管理 -->
        <div class="upgrade-card">
            <h2>备份管理</h2>
            <div id="backupList" class="backup-list">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        console.log('升级页面脚本开始执行');
        console.log('API对象:', typeof API);
        
        // 使用命名空间避免全局变量污染
        window.upgradeModule = (function() {
            console.log('upgradeModule初始化');
            
            let updateInfo = null;
            let isUpgrading = false;

            // 页面加载时初始化
            function init() {
                console.log('开始初始化升级页面');
                loadCurrentVersion();
                checkUpdate();
                loadBackups();
            }
            
            // 确保DOM加载完成后执行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // 加载当前版本
            async function loadCurrentVersion() {
                console.log('开始加载当前版本');
                try {
                    const result = await API.get('/api/upgrade/current-version');
                    console.log('当前版本结果:', result);
                    if (result.code === 200) {
                        document.getElementById('currentVersion').textContent = result.data.version;
                    }
                } catch (error) {
                    console.error('加载当前版本失败:', error);
                }
            }

            // 检查更新
            async function checkUpdate() {
                console.log('开始检查更新');
                try {
                    const result = await API.get('/api/upgrade/check');
                    console.log('检查更新结果:', result);
                    
                    if (result.code === 200) {
                        const data = result.data;
                        
                        if (data.has_update) {
                            updateInfo = data;
                            showUpdateBanner(data);
                        } else {
                            document.getElementById('latestVersion').textContent = data.current_version || '-';
                            alert('当前已是最新版本');
                        }
                    }
                } catch (error) {
                    console.error('检查更新失败:', error);
                    alert('检查更新失败: ' + error.message);
                }
            }

            // 显示更新横幅
            function showUpdateBanner(data) {
                document.getElementById('latestVersion').textContent = data.latest_version;
                document.getElementById('updateMessage').textContent = 
                    `发现新版本 ${data.latest_version}，当前版本 ${data.current_version}`;
                
                if (data.release_notes) {
                    document.getElementById('releaseNotes').textContent = data.release_notes;
                }
                
                document.getElementById('updateBanner').style.display = 'block';
            }

            // 开始升级
            async function startUpgrade() {
                if (!updateInfo) {
                    alert('没有可用的更新');
                    return;
                }

                if (isUpgrading) {
                    alert('升级正在进行中');
                    return;
                }

                if (!confirm(`确定要升级到版本 ${updateInfo.latest_version} 吗？\n\n升级前会自动创建备份，升级过程中请勿关闭程序。`)) {
                    return;
                }

                try {
                    isUpgrading = true;
                    
                    document.getElementById('upgradeProgress').style.display = 'block';
                    document.getElementById('updateBanner').style.display = 'none';
                    
                    const result = await API.post('/api/upgrade/start', {
                        package_url: updateInfo.package_url,
                        package_md5: updateInfo.package_md5,
                        to_version: updateInfo.latest_version
                    });
                    
                    if (result.code === 200) {
                        pollUpgradeStatus();
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error('启动升级失败:', error);
                    alert('启动升级失败: ' + error.message);
                    isUpgrading = false;
                    document.getElementById('upgradeProgress').style.display = 'none';
                }
            }

            // 轮询升级状态
            function pollUpgradeStatus() {
                const interval = setInterval(async () => {
                    try {
                        const result = await API.get('/api/upgrade/status');
                        
                        if (result.code === 200) {
                            const status = result.data;
                            
                            const progress = status.progress || 0;
                            document.getElementById('progressFill').style.width = progress + '%';
                            document.getElementById('progressFill').textContent = progress + '%';
                            document.getElementById('progressMessage').textContent = status.message || '';
                            
                            if (!status.is_upgrading) {
                                clearInterval(interval);
                                isUpgrading = false;
                                
                                if (status.error) {
                                    alert('升级失败: ' + status.error);
                                } else {
                                    alert('升级完成！请重启应用以使用新版本。');
                                    loadBackups();
                                }
                            }
                        }
                    } catch (error) {
                        console.error('获取升级状态失败:', error);
                    }
                }, 1000);
            }

            // 加载备份列表
            async function loadBackups() {
                try {
                    const result = await API.get('/api/upgrade/backups');
                    
                    if (result.code === 200) {
                        renderBackups(result.data);
                    }
                } catch (error) {
                    console.error('加载备份列表失败:', error);
                }
            }

            // 渲染备份列表
            function renderBackups(backups) {
                const container = document.getElementById('backupList');
                
                if (backups.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无备份</div>';
                    return;
                }
                
                container.innerHTML = backups.map(backup => `
                    <div class="backup-item">
                        <div class="backup-info">
                            <div class="backup-name">
                                ${backup.name}
                                <span class="badge badge-success">v${backup.version}</span>
                            </div>
                            <div class="backup-meta">
                                创建时间: ${backup.created_at} | 大小: ${formatSize(backup.size)}
                            </div>
                        </div>
                        <div class="backup-actions">
                            <button class="btn btn-secondary btn-small" onclick="window.upgradeModule.rollbackToBackup('${backup.path}')">回退</button>
                            <button class="btn btn-danger btn-small" onclick="window.upgradeModule.deleteBackupItem('${backup.path}')">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            // 格式化文件大小
            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
                if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
                return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
            }

            // 回退到备份
            async function rollbackToBackup(backupPath) {
                if (!confirm('确定要回退到此备份吗？\n\n回退后需要重启应用。')) {
                    return;
                }

                try {
                    const result = await API.post('/api/upgrade/rollback', {
                        backup_path: backupPath
                    });
                    
                    if (result.code === 200) {
                        alert('回退成功！请重启应用。');
                    } else {
                        alert('回退失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('回退失败:', error);
                    alert('回退失败: ' + error.message);
                }
            }

            // 删除备份
            async function deleteBackupItem(backupPath) {
                if (!confirm('确定要删除此备份吗？')) {
                    return;
                }

                try {
                    const result = await API.delete(`/api/upgrade/backup/${encodeURIComponent(backupPath)}`);
                    
                    if (result.code === 200) {
                        alert('删除成功');
                        loadBackups();
                    } else {
                        alert('删除失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('删除备份失败:', error);
                    alert('删除失败: ' + error.message);
                }
            }

            // 返回公共接口
            return {
                checkUpdate,
                startUpgrade,
                rollbackToBackup,
                deleteBackupItem
            };
        })();
    </script>
</body>
</html>
