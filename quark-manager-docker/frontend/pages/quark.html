<!-- 夸克网盘页面 -->
<style>
    .breadcrumb {
        padding: 12px 0;
        color: #666;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .breadcrumb-item {
        cursor: pointer;
        transition: color 0.2s;
    }
    .breadcrumb-item:hover {
        color: #1890ff;
    }
    .breadcrumb-separator {
        color: #d9d9d9;
    }
    .file-icon {
        margin-right: 8px;
        font-size: 16px;
    }
    .file-name {
        display: flex;
        align-items: center;
    }
    .folder-name {
        color: #1890ff;
        cursor: pointer;
    }
    .folder-name:hover {
        text-decoration: underline;
    }
</style>

<div class="toolbar">
    <div class="toolbar-title">夸克网盘</div>
    <div class="toolbar-actions">
        <select class="filter-select" id="accountSelect" onchange="switchAccount()">
            <option value="">选择账号</option>
        </select>
        <button class="btn" onclick="refreshFiles()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="showCreateFolderModal()">+ 新建文件夹</button>
    </div>
</div>

<div id="breadcrumb" class="breadcrumb">
    <span class="breadcrumb-item" onclick="navigateToFolder('0')">根目录</span>
</div>

<table class="data-table">
    <thead>
        <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" /></th>
            <th>文件名</th>
            <th width="120">大小</th>
            <th width="180">修改时间</th>
            <th width="280">操作</th>
        </tr>
    </thead>
    <tbody id="fileList">
        <tr>
            <td colspan="5" style="text-align: center; padding: 40px; color: #999;">
                请先选择账号
            </td>
        </tr>
    </tbody>
</table>

<!-- 新建文件夹模态框 -->
<div id="createFolderModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">新建文件夹</div>
            <button class="modal-close" onclick="hideCreateFolderModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">文件夹名称</label>
                <input type="text" class="form-input" id="folderName" placeholder="请输入文件夹名称" />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="hideCreateFolderModal()">取消</button>
            <button class="btn btn-primary" onclick="createFolder()">创建</button>
        </div>
    </div>
</div>

<!-- 分享文件模态框 -->
<div id="shareModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <div class="modal-title">分享文件</div>
            <button class="modal-close" onclick="hideShareModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">有效期</label>
                <select class="form-input" id="shareExpireDays">
                    <option value="1">1天</option>
                    <option value="7" selected>7天</option>
                    <option value="30">30天</option>
                    <option value="0">永久</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="shareNeedPassword" onchange="togglePasswordInput()" />
                    需要提取码
                </label>
            </div>
            <div class="form-group" id="passwordGroup" style="display: none;">
                <label class="form-label">提取码</label>
                <input type="text" class="form-input" id="sharePassword" placeholder="留空自动生成" maxlength="4" />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="hideShareModal()">取消</button>
            <button class="btn btn-primary" onclick="shareFiles()">生成分享链接</button>
        </div>
    </div>
</div>

<!-- 分享结果模态框 -->
<div id="shareResultModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <div class="modal-title">分享成功</div>
            <button class="modal-close" onclick="hideShareResultModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">分享链接</label>
                <input type="text" class="form-input" id="shareUrl" readonly />
            </div>
            <div class="form-group" id="sharePasswordGroup" style="display: none;">
                <label class="form-label">提取码</label>
                <input type="text" class="form-input" id="sharePasswordResult" readonly />
            </div>
            <div class="form-group">
                <label class="form-label">有效期至</label>
                <input type="text" class="form-input" id="shareExpireTime" readonly />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="copyShareInfo()">复制分享信息</button>
            <button class="btn btn-primary" onclick="hideShareResultModal()">关闭</button>
        </div>
    </div>
</div>

<script>
(function() {
    // 使用IIFE避免全局变量污染
    let currentAccountId = null;
    let currentFolderId = '0';
    let folderPath = [{ id: '0', name: '根目录' }];
    let selectedFiles = [];
    let shareResult = null;

    // 加载账号列表
    async function loadAccounts() {
        try {
            const result = await AccountAPI.getList();
            
            if (result.code === 200 && result.data && result.data.length > 0) {
                const select = document.getElementById('accountSelect');
                select.innerHTML = '<option value="">选择账号</option>' + 
                    result.data.map(account => 
                        `<option value="${account.id}" ${account.is_main ? 'selected' : ''}>
                            ${account.remark} ${account.is_main ? '(主账号)' : ''}
                        </option>`
                    ).join('');
                
                // 自动选择主账号
                const mainAccount = result.data.find(a => a.is_main);
                if (mainAccount) {
                    currentAccountId = mainAccount.id;
                    loadFiles();
                }
            } else {
                Message.warning('请先在系统配置中添加夸克账号');
            }
        } catch (error) {
            console.error('加载账号列表失败:', error);
            Message.error('加载账号列表失败');
        }
    }

    // 切换账号
    window.switchAccount = function() {
        const select = document.getElementById('accountSelect');
        currentAccountId = select.value;
        
        if (currentAccountId) {
            currentFolderId = '0';
            folderPath = [{ id: '0', name: '根目录' }];
            updateBreadcrumb();
            loadFiles();
        }
    }

    // 加载文件列表
    async function loadFiles() {
        if (!currentAccountId) {
            Message.warning('请先选择账号');
            return;
        }

        const tbody = document.getElementById('fileList');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;"><div class="loading">加载中...</div></td></tr>';

        try {
            const result = await QuarkAPI.getFiles(currentAccountId, currentFolderId);
            
            if (result.code === 200 && result.data) {
                displayFiles(result.data.items || []);
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: #999;">${result.message || '加载失败'}</td></tr>`;
            }
        } catch (error) {
            console.error('加载文件列表失败:', error);
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #999;">加载失败</td></tr>';
        }
    }

    // 显示文件列表
    function displayFiles(files) {
        const tbody = document.getElementById('fileList');
        
        if (!files || files.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #999;">此文件夹为空</td></tr>';
            return;
        }

        // 文件夹排在前面
        files.sort((a, b) => {
            if (a.isFolder && !b.isFolder) return -1;
            if (!a.isFolder && b.isFolder) return 1;
            return 0;
        });

        tbody.innerHTML = files.map(file => {
            const icon = getFileIcon(file.name, file.isFolder);
            const nameClass = file.isFolder ? 'folder-name' : '';
            const nameClick = file.isFolder ? `onclick="navigateToFolder('${file.id}', '${escapeHtml(file.name)}')"` : '';
            
            return `
                <tr>
                    <td><input type="checkbox" class="file-checkbox" value="${file.id}" onchange="updateSelection()" /></td>
                    <td>
                        <div class="file-name">
                            <span class="file-icon">${icon}</span>
                            <span class="${nameClass}" ${nameClick}>${escapeHtml(file.name)}</span>
                        </div>
                    </td>
                    <td>${file.isFolder ? '-' : formatFileSize(file.size)}</td>
                    <td>${formatDateTime(file.modifiedTime)}</td>
                    <td>
                        <div class="action-buttons">
                            ${!file.isFolder && (file.mimeType?.startsWith('video/') || file.mimeType?.startsWith('image/')) ? 
                                `<button class="btn btn-small" onclick="previewFile('${file.id}')">预览</button>` : ''}
                            ${!file.isFolder ? `<button class="btn btn-small" onclick="downloadFile('${file.id}')">下载</button>` : ''}
                            <button class="btn btn-small" onclick="shareFile('${file.id}')">分享</button>
                            <button class="btn btn-small btn-danger" onclick="deleteFile('${file.id}', '${escapeHtml(file.name)}')">删除</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // 更新面包屑导航
    function updateBreadcrumb() {
        const breadcrumb = document.getElementById('breadcrumb');
        breadcrumb.innerHTML = folderPath.map((folder, index) => {
            const isLast = index === folderPath.length - 1;
            return `
                <span class="breadcrumb-item" onclick="navigateToFolder('${folder.id}', '${escapeHtml(folder.name)}')">${escapeHtml(folder.name)}</span>
                ${!isLast ? '<span class="breadcrumb-separator">/</span>' : ''}
            `;
        }).join('');
    }

    // 导航到文件夹
    window.navigateToFolder = async function(folderId, folderName) {
        // 如果点击的是路径中已存在的文件夹,截断路径
        const index = folderPath.findIndex(f => f.id === folderId);
        if (index !== -1) {
            folderPath = folderPath.slice(0, index + 1);
        } else if (folderId !== '0') {
            // 进入新文件夹,添加到路径
            folderPath.push({ id: folderId, name: folderName });
        } else {
            // 返回根目录
            folderPath = [{ id: '0', name: '根目录' }];
        }
        
        currentFolderId = folderId;
        updateBreadcrumb();
        loadFiles();
    }

    // 刷新文件列表
    window.refreshFiles = function() {
        loadFiles();
    }

    // 显示新建文件夹模态框
    window.showCreateFolderModal = function() {
        if (!currentAccountId) {
            Message.warning('请先选择账号');
            return;
        }
        document.getElementById('folderName').value = '';
        document.getElementById('createFolderModal').classList.add('show');
    }

    // 隐藏新建文件夹模态框
    window.hideCreateFolderModal = function() {
        document.getElementById('createFolderModal').classList.remove('show');
    }

    // 创建文件夹
    window.createFolder = async function() {
        const name = document.getElementById('folderName').value.trim();
        
        if (!name) {
            Message.warning('请输入文件夹名称');
            return;
        }

        try {
            const result = await QuarkAPI.createFolder(currentAccountId, currentFolderId, name);
            
            if (result.code === 200) {
                Message.success('文件夹创建成功');
                window.hideCreateFolderModal();
                loadFiles();
            } else {
                Message.error(result.message || '创建失败');
            }
        } catch (error) {
            console.error('创建文件夹失败:', error);
            Message.error('创建失败');
        }
    }

    // 删除文件
    window.deleteFile = async function(fileId, fileName) {
        if (!confirm(`确定要删除"${fileName}"吗？`)) {
            return;
        }

        try {
            const result = await QuarkAPI.deleteFiles(currentAccountId, [fileId]);
            
            if (result.code === 200) {
                Message.success('删除成功');
                loadFiles();
            } else {
                Message.error(result.message || '删除失败');
            }
        } catch (error) {
            console.error('删除文件失败:', error);
            Message.error('删除失败');
        }
    }

    // 分享文件
    window.shareFile = function(fileId) {
        selectedFiles = [fileId];
        document.getElementById('shareModal').classList.add('show');
    }

    // 隐藏分享模态框
    window.hideShareModal = function() {
        document.getElementById('shareModal').classList.remove('show');
    }

    // 切换密码输入框
    window.togglePasswordInput = function() {
        const checked = document.getElementById('shareNeedPassword').checked;
        document.getElementById('passwordGroup').style.display = checked ? 'block' : 'none';
    }

    // 执行分享
    window.shareFiles = async function() {
        if (selectedFiles.length === 0) {
            Message.warning('请选择要分享的文件');
            return;
        }

        const expireDays = parseInt(document.getElementById('shareExpireDays').value);
        const needPassword = document.getElementById('shareNeedPassword').checked;
        const password = document.getElementById('sharePassword').value.trim();

        try {
            const result = await QuarkAPI.shareFiles(
                currentAccountId,
                selectedFiles,
                expireDays,
                needPassword,
                password || null
            );
            
            if (result.code === 200 && result.data) {
                shareResult = result.data;
                showShareResult(result.data);
                window.hideShareModal();
            } else {
                Message.error(result.message || '分享失败');
            }
        } catch (error) {
            console.error('分享失败:', error);
            Message.error('分享失败');
        }
    }

    // 显示分享结果
    function showShareResult(data) {
        document.getElementById('shareUrl').value = data.shareUrl || data.share_url;
        
        if (data.password) {
            document.getElementById('sharePasswordGroup').style.display = 'block';
            document.getElementById('sharePasswordResult').value = data.password;
        } else {
            document.getElementById('sharePasswordGroup').style.display = 'none';
        }
        
        document.getElementById('shareExpireTime').value = formatDateTime(data.expireTime || data.expire_time);
        document.getElementById('shareResultModal').classList.add('show');
    }

    // 隐藏分享结果模态框
    window.hideShareResultModal = function() {
        document.getElementById('shareResultModal').classList.remove('show');
    }

    // 复制分享信息
    window.copyShareInfo = function() {
        if (!shareResult) return;
        
        let text = `分享链接: ${shareResult.shareUrl || shareResult.share_url}`;
        if (shareResult.password) {
            text += `\n提取码: ${shareResult.password}`;
        }
        text += `\n有效期至: ${formatDateTime(shareResult.expireTime || shareResult.expire_time)}`;
        
        copyToClipboard(text);
    }

    // 下载文件
    window.downloadFile = async function(fileId) {
        try {
            const result = await QuarkAPI.getDownloadUrl(currentAccountId, fileId);
            
            if (result.code === 200 && result.data) {
                window.open(result.data.downloadUrl || result.data.download_url, '_blank');
            } else {
                Message.error(result.message || '获取下载链接失败');
            }
        } catch (error) {
            console.error('获取下载链接失败:', error);
            Message.error('获取下载链接失败');
        }
    }

    // 预览文件
    window.previewFile = function(fileId) {
        Message.info('预览功能开发中');
    }

    // 全选/取消全选
    window.toggleSelectAll = function() {
        const checked = document.getElementById('selectAll').checked;
        document.querySelectorAll('.file-checkbox').forEach(cb => {
            cb.checked = checked;
        });
        updateSelection();
    }

    // 更新选择
    window.updateSelection = function() {
        selectedFiles = Array.from(document.querySelectorAll('.file-checkbox:checked'))
            .map(cb => cb.value);
    }

    // HTML转义函数
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    loadAccounts();
})();
</script>
