<!-- Cron表达式配置模态框 -->
<!-- 使用方法：在页面中引入此HTML片段，并引入 cron-config.css 和 cron-config.js -->
<div id="cronModal" class="modal">
    <div class="modal-content cron-modal-simple">
        <!-- 标题栏 -->
        <div class="cron-modal-header">
            <div class="cron-modal-title">设置执行时间</div>
            <button class="cron-modal-close" onclick="CronConfig.hideCronModal()">×</button>
        </div>
        
        <div class="cron-modal-body">
            <!-- 执行类型选择 -->
            <div class="cron-type-selector">
                <label class="cron-type-option">
                    <input type="radio" name="cronType" value="daily" checked onchange="CronConfig.handleCronTypeChange('daily')" />
                    <span>每日执行</span>
                </label>
                <label class="cron-type-option">
                    <input type="radio" name="cronType" value="weekly" onchange="CronConfig.handleCronTypeChange('weekly')" />
                    <span>每周执行</span>
                </label>
                <label class="cron-type-option">
                    <input type="radio" name="cronType" value="once" onchange="CronConfig.handleCronTypeChange('once')" />
                    <span>一次性</span>
                </label>
            </div>
            
            <!-- 每日执行配置 -->
            <div id="dailyConfig" class="cron-config-section">
                <div class="cron-time-picker">
                    <div class="cron-time-group">
                        <label class="cron-time-label">小时</label>
                        <select class="cron-time-select" id="dailyHour">
                            <!-- 0-23小时 -->
                        </select>
                    </div>
                    <div class="cron-time-separator">:</div>
                    <div class="cron-time-group">
                        <label class="cron-time-label">分钟</label>
                        <select class="cron-time-select" id="dailyMinute">
                            <!-- 0-59分钟 -->
                        </select>
                    </div>
                    <button class="cron-add-btn" onclick="CronConfig.addDailyTime()">+ 添加</button>
                </div>
                
                <!-- 已添加的时间点列表 -->
                <div id="dailyTimeList" class="cron-time-list">
                    <!-- 动态生成时间点 -->
                </div>
                
                <div class="cron-hint">每天在指定时间执行，可添加多个时间点</div>
            </div>
            
            <!-- 每周执行配置 -->
            <div id="weeklyConfig" class="cron-config-section" style="display: none;">
                <div class="cron-week-selector">
                    <label class="cron-week-label">选择星期</label>
                    <div class="cron-week-buttons">
                        <button class="cron-week-btn" data-day="1" onclick="CronConfig.toggleWeekDay(1)">周一</button>
                        <button class="cron-week-btn" data-day="2" onclick="CronConfig.toggleWeekDay(2)">周二</button>
                        <button class="cron-week-btn" data-day="3" onclick="CronConfig.toggleWeekDay(3)">周三</button>
                        <button class="cron-week-btn" data-day="4" onclick="CronConfig.toggleWeekDay(4)">周四</button>
                        <button class="cron-week-btn" data-day="5" onclick="CronConfig.toggleWeekDay(5)">周五</button>
                        <button class="cron-week-btn" data-day="6" onclick="CronConfig.toggleWeekDay(6)">周六</button>
                        <button class="cron-week-btn" data-day="0" onclick="CronConfig.toggleWeekDay(0)">周日</button>
                    </div>
                </div>
                
                <div class="cron-time-picker">
                    <div class="cron-time-group">
                        <label class="cron-time-label">小时</label>
                        <select class="cron-time-select" id="weeklyHour">
                            <!-- 0-23小时 -->
                        </select>
                    </div>
                    <div class="cron-time-separator">:</div>
                    <div class="cron-time-group">
                        <label class="cron-time-label">分钟</label>
                        <select class="cron-time-select" id="weeklyMinute">
                            <!-- 0-59分钟 -->
                        </select>
                    </div>
                    <button class="cron-add-btn" onclick="CronConfig.addWeeklyTime()">+ 添加</button>
                </div>
                
                <!-- 已添加的时间点列表 -->
                <div id="weeklyTimeList" class="cron-time-list">
                    <!-- 动态生成时间点 -->
                </div>
                
                <div class="cron-hint">在选定的星期几的指定时间执行，可添加多个时间点</div>
            </div>
            
            <!-- 一次性执行配置 -->
            <div id="onceConfig" class="cron-config-section" style="display: none;">
                <div class="cron-hint" style="margin-bottom: 16px; color: #666;">
                    任务将在保存后立即执行一次，不会定时重复执行
                </div>
                <div class="cron-once-info" style="padding: 16px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 4px; color: #0369a1;">
                    <div style="font-weight: 500; margin-bottom: 8px;">⚠️ 注意事项</div>
                    <ul style="margin: 0; padding-left: 20px; line-height: 1.8;">
                        <li>任务保存后将立即加入执行队列</li>
                        <li>执行完成后任务状态将变为"已完成"</li>
                        <li>如需再次执行，请编辑任务重新设置</li>
                    </ul>
                </div>
            </div>
            
            <!-- 执行时间预览 -->
            <div class="cron-preview-section">
                <div class="cron-preview-title">下次执行时间</div>
                <div class="cron-preview-content" id="cronPreviewContent">
                    <div class="cron-preview-item">
                        <span class="cron-preview-icon">⏰</span>
                        <span id="nextExecutionTime">请选择执行时间</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部按钮 -->
        <div class="cron-modal-footer">
            <button class="cron-btn-secondary" onclick="CronConfig.hideCronModal()">取消</button>
            <button class="cron-btn-primary" onclick="CronConfig.applyCronSimple()">确定</button>
        </div>
    </div>
</div>
