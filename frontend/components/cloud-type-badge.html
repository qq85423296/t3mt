<!-- 云盘类型标签组件 -->
<style>
.cloud-type-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    margin-left: 5px;
    vertical-align: middle;
}

.cloud-type-badge.quark {
    background-color: #4CAF50;
}

.cloud-type-badge.cloud189 {
    background-color: #2196F3;
}

.cloud-type-badge.default {
    background-color: #999;
}

/* 云盘类型标签带图标 */
.cloud-type-badge-with-icon {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    margin-left: 8px;
}

.cloud-type-badge-with-icon .icon {
    width: 14px;
    height: 14px;
    margin-right: 5px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.3);
}

.cloud-type-badge-with-icon.quark {
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
}

.cloud-type-badge-with-icon.cloud189 {
    background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
}

/* 表格中的云盘类型标签 */
.table .cloud-type-badge {
    margin-left: 0;
}
</style>

<script>
// 云盘类型标签生成器
const CloudTypeBadge = {
    // 创建简单标签
    create(cloudType) {
        if (!cloudType) {
            return '<span class="cloud-type-badge default">未知</span>';
        }
        
        const displayNames = {
            'quark': '夸克',
            'cloud189': '天翼189'
        };
        
        const displayName = displayNames[cloudType] || cloudType;
        return `<span class="cloud-type-badge ${cloudType}">${displayName}</span>`;
    },
    
    // 创建带图标的标签
    createWithIcon(cloudType) {
        if (!cloudType) {
            return '<span class="cloud-type-badge-with-icon default"><span class="icon"></span>未知</span>';
        }
        
        const displayNames = {
            'quark': '夸克网盘',
            'cloud189': '天翼189云盘'
        };
        
        const displayName = displayNames[cloudType] || cloudType;
        return `<span class="cloud-type-badge-with-icon ${cloudType}"><span class="icon"></span>${displayName}</span>`;
    },
    
    // 在指定元素中渲染标签
    render(element, cloudType, withIcon = false) {
        if (element) {
            element.innerHTML = withIcon ? this.createWithIcon(cloudType) : this.create(cloudType);
        }
    },
    
    // 批量渲染标签（用于表格）
    renderAll(selector, cloudTypeGetter) {
        const elements = document.querySelectorAll(selector);
        elements.forEach((element, index) => {
            const cloudType = cloudTypeGetter(element, index);
            this.render(element, cloudType);
        });
    }
};
</script>
