<!-- 任务插件选择组件 -->
<style>
    .task-plugins-section {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #E5E7EB;
    }
    .task-plugins-title {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .task-plugins-title .icon {
        font-size: 16px;
    }
    .task-plugins-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .task-plugin-item {
        padding: 12px;
        background: #F9FAFB;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        transition: all 0.2s;
    }
    .task-plugin-item:hover {
        background: #F3F4F6;
    }
    .task-plugin-item.selected {
        background: #EFF6FF;
        border-color: #3B82F6;
    }
    .task-plugin-header {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .task-plugin-checkbox {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }
    .task-plugin-info {
        flex: 1;
        min-width: 0;
    }
    .task-plugin-name {
        font-size: 14px;
        font-weight: 500;
        color: #374151;
    }
    .task-plugin-desc {
        font-size: 12px;
        color: #6B7280;
        margin-top: 2px;
    }
    .task-plugin-status {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #D1FAE5;
        color: #059669;
    }
    .task-plugin-params {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #E5E7EB;
        display: none;
    }
    .task-plugin-item.selected .task-plugin-params {
        display: block;
    }
    .task-plugin-params-title {
        font-size: 12px;
        color: #6B7280;
        margin-bottom: 8px;
    }
    .task-plugin-params-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .task-plugin-param {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: #fff;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .task-plugin-param:hover {
        border-color: #3B82F6;
    }
    .task-plugin-param.checked {
        background: #EFF6FF;
        border-color: #3B82F6;
        color: #2563EB;
    }
    .task-plugin-param input {
        width: 14px;
        height: 14px;
        margin: 0;
    }
    .task-plugin-param .param-label {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }
    .task-plugin-param .param-label-name {
        font-size: 12px;
    }
    .task-plugin-param .param-label-key {
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 10px;
        color: #9CA3AF;
    }
    .task-plugin-param.checked .param-label-key {
        color: #60A5FA;
    }
    .task-plugins-empty {
        text-align: center;
        padding: 20px;
        color: #9CA3AF;
        font-size: 13px;
    }
    .task-plugins-hint {
        font-size: 12px;
        color: #9CA3AF;
        margin-top: 8px;
    }
    .available-params-section {
        margin-top: 12px;
        padding: 12px;
        background: #F9FAFB;
        border: 1px solid #E5E7EB;
        border-radius: 6px;
    }
    .available-params-title {
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 8px;
    }
    .available-params-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .available-param-tag {
        display: inline-flex;
        flex-direction: column;
        padding: 4px 8px;
        background: #E5E7EB;
        border-radius: 4px;
        font-size: 11px;
        color: #4B5563;
        gap: 2px;
    }
    .available-param-tag .param-name {
        font-weight: 500;
        color: #374151;
    }
    .available-param-tag .param-key {
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 10px;
        color: #6B7280;
        background: #fff;
        padding: 1px 4px;
        border-radius: 2px;
    }
</style>

<div class="task-plugins-section" id="taskPluginsSection">
    <div class="task-plugins-title">
        <span class="icon">🔌</span>
        <span>执行完成后触发插件</span>
    </div>
    
    <!-- 可用参数说明 -->
    <div class="available-params-section" id="availableParamsSection">
        <div class="available-params-title">📋 任务可输出的参数（供插件使用）</div>
        <div class="available-params-list" id="availableParamsList">
            <!-- 动态生成 -->
        </div>
    </div>
    
    <div class="task-plugins-list" id="taskPluginsList">
        <div class="task-plugins-empty">加载中...</div>
    </div>
    <div class="task-plugins-hint">勾选插件后，可选择要传递给插件的参数</div>
</div>

<script>
/**
 * 任务插件选择管理器
 */
window.TaskPluginsManager = (function() {
    // 当前任务关联的插件
    let selectedPlugins = [];
    // 所有可用插件
    let availablePlugins = [];
    // 当前任务类型
    let currentTaskType = null;
    
    // 不同任务类型可输出的参数定义
    const TASK_PARAMS = {
        transfer: [
            { key: 'task_id', name: '任务ID', desc: '任务唯一标识' },
            { key: 'task_name', name: '任务名称', desc: '用户设置的任务名称' },
            { key: 'task_type', name: '任务类型', desc: '固定为 transfer' },
            { key: 'status', name: '执行状态', desc: 'success/failed/partial' },
            { key: 'start_time', name: '开始时间', desc: '任务开始执行时间' },
            { key: 'end_time', name: '结束时间', desc: '任务执行完成时间' },
            { key: 'duration', name: '执行耗时', desc: '执行耗时（秒）' },
            { key: 'source_path', name: '来源目录', desc: '分享链接的源目录' },
            { key: 'target_path', name: '目标目录', desc: '转存的目标目录' },
            { key: 'total_count', name: '总文件数', desc: '需要转存的文件总数' },
            { key: 'success_count', name: '成功数', desc: '转存成功的文件数' },
            { key: 'failed_count', name: '失败数', desc: '转存失败的文件数' },
            { key: 'total_size', name: '总大小', desc: '转存文件的总大小（字节）' },
            { key: 'error_message', name: '错误信息', desc: '失败时的错误信息' }
        ],
        download: [
            { key: 'task_id', name: '任务ID', desc: '任务唯一标识' },
            { key: 'task_name', name: '任务名称', desc: '用户设置的任务名称' },
            { key: 'task_type', name: '任务类型', desc: '固定为 download' },
            { key: 'status', name: '执行状态', desc: 'success/failed/partial' },
            { key: 'start_time', name: '开始时间', desc: '任务开始执行时间' },
            { key: 'end_time', name: '结束时间', desc: '任务执行完成时间' },
            { key: 'duration', name: '执行耗时', desc: '执行耗时（秒）' },
            { key: 'source_path', name: '网盘目录', desc: '云盘源目录' },
            { key: 'target_path', name: '本地目录', desc: '下载到的本地目录' },
            { key: 'total_count', name: '总文件数', desc: '需要下载的文件总数' },
            { key: 'success_count', name: '成功数', desc: '下载成功的文件数' },
            { key: 'failed_count', name: '失败数', desc: '下载失败的文件数' },
            { key: 'total_size', name: '总大小', desc: '下载文件的总大小（字节）' },
            { key: 'error_message', name: '错误信息', desc: '失败时的错误信息' }
        ],
        video: [
            { key: 'task_id', name: '任务ID', desc: '任务唯一标识' },
            { key: 'task_name', name: '任务名称', desc: '用户设置的任务名称' },
            { key: 'task_type', name: '任务类型', desc: '固定为 video' },
            { key: 'status', name: '执行状态', desc: 'success/failed/partial' },
            { key: 'start_time', name: '开始时间', desc: '任务开始执行时间' },
            { key: 'end_time', name: '结束时间', desc: '任务执行完成时间' },
            { key: 'duration', name: '执行耗时', desc: '执行耗时（秒）' },
            { key: 'video_name', name: '影视名称', desc: '影视剧名称' },
            { key: 'platform', name: '平台', desc: '视频平台（芒果/爱奇艺等）' },
            { key: 'video_type', name: '影视类型', desc: '电视剧/电影/综艺等' },
            { key: 'target_path', name: '保存目录', desc: '视频保存的本地目录' },
            { key: 'total_count', name: '总集数', desc: '需要下载的总集数' },
            { key: 'success_count', name: '成功数', desc: '下载成功的集数' },
            { key: 'failed_count', name: '失败数', desc: '下载失败的集数' },
            { key: 'total_size', name: '总大小', desc: '下载文件的总大小（字节）' },
            { key: 'error_message', name: '错误信息', desc: '失败时的错误信息' }
        ]
    };
    
    // 默认选中的参数
    const DEFAULT_PARAMS = ['task_name', 'task_type', 'status', 'start_time', 'end_time', 
                           'source_path', 'target_path', 'total_count', 'success_count', 
                           'failed_count', 'total_size', 'error_message', 'duration'];
    
    /**
     * 初始化
     */
    async function init(taskType) {
        currentTaskType = taskType;
        renderAvailableParams();
        await loadAvailablePlugins();
    }
    
    /**
     * 渲染可用参数列表
     */
    function renderAvailableParams() {
        const container = document.getElementById('availableParamsList');
        const params = TASK_PARAMS[currentTaskType] || [];
        
        container.innerHTML = params.map(p => 
            `<span class="available-param-tag" title="${p.desc}">
                <span class="param-name">${p.name}</span>
                <span class="param-key">{${p.key}}</span>
            </span>`
        ).join('');
    }
    
    /**
     * 加载可用插件列表
     */
    async function loadAvailablePlugins() {
        try {
            const response = await fetch('/api/plugins/active');
            const result = await response.json();
            
            if (result.code === 200) {
                availablePlugins = result.data || [];
                renderPluginList();
            }
        } catch (error) {
            console.error('加载插件列表失败:', error);
            document.getElementById('taskPluginsList').innerHTML = 
                '<div class="task-plugins-empty">加载插件列表失败</div>';
        }
    }
    
    /**
     * 渲染插件列表
     */
    function renderPluginList() {
        const container = document.getElementById('taskPluginsList');
        const params = TASK_PARAMS[currentTaskType] || [];
        
        if (!availablePlugins || availablePlugins.length === 0) {
            container.innerHTML = `
                <div class="task-plugins-empty">
                    暂无已启动的插件，请先在<a href="javascript:void(0)" 
                    onclick="window.parent.loadPage && window.parent.loadPage('plugins')" 
                    style="color: #3B82F6;">插件管理</a>中启动插件
                </div>
            `;
            return;
        }
        
        container.innerHTML = availablePlugins.map(plugin => {
            const selected = selectedPlugins.find(p => p.plugin_id === plugin.plugin_id);
            const isSelected = !!selected;
            const selectedParams = selected?.selected_params || DEFAULT_PARAMS;
            
            return `
                <div class="task-plugin-item ${isSelected ? 'selected' : ''}" 
                     data-plugin-id="${plugin.plugin_id}">
                    <div class="task-plugin-header">
                        <input type="checkbox" class="task-plugin-checkbox" 
                               id="plugin_${plugin.plugin_id}" 
                               ${isSelected ? 'checked' : ''}
                               onchange="TaskPluginsManager.togglePlugin('${plugin.plugin_id}', this.checked)">
                        <div class="task-plugin-info">
                            <div class="task-plugin-name">${plugin.plugin_name}</div>
                            ${plugin.plugin_desc ? `<div class="task-plugin-desc">${plugin.plugin_desc}</div>` : ''}
                        </div>
                        <span class="task-plugin-status">运行中</span>
                    </div>
                    <div class="task-plugin-params">
                        <div class="task-plugin-params-title">选择要传递给此插件的参数：</div>
                        <div class="task-plugin-params-list">
                            ${params.map(p => `
                                <label class="task-plugin-param ${selectedParams.includes(p.key) ? 'checked' : ''}" 
                                       title="${p.desc}">
                                    <input type="checkbox" 
                                           ${selectedParams.includes(p.key) ? 'checked' : ''}
                                           onchange="TaskPluginsManager.toggleParam('${plugin.plugin_id}', '${p.key}', this.checked, this.parentElement)">
                                    <span class="param-label">
                                        <span class="param-label-name">${p.name}</span>
                                        <span class="param-label-key">{${p.key}}</span>
                                    </span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    /**
     * 切换插件选中状态
     */
    function togglePlugin(pluginId, checked) {
        const item = document.querySelector(`.task-plugin-item[data-plugin-id="${pluginId}"]`);
        
        if (checked) {
            if (!selectedPlugins.some(p => p.plugin_id === pluginId)) {
                selectedPlugins.push({
                    plugin_id: pluginId,
                    sort_order: selectedPlugins.length,
                    pass_task_param: true,
                    delay_seconds: 0,
                    plugin_config: {},
                    selected_params: [...DEFAULT_PARAMS]
                });
            }
            item?.classList.add('selected');
        } else {
            selectedPlugins = selectedPlugins.filter(p => p.plugin_id !== pluginId);
            item?.classList.remove('selected');
        }
    }
    
    /**
     * 切换参数选中状态
     */
    function toggleParam(pluginId, paramKey, checked, labelEl) {
        const plugin = selectedPlugins.find(p => p.plugin_id === pluginId);
        if (!plugin) return;
        
        if (!plugin.selected_params) {
            plugin.selected_params = [...DEFAULT_PARAMS];
        }
        
        if (checked) {
            if (!plugin.selected_params.includes(paramKey)) {
                plugin.selected_params.push(paramKey);
            }
            labelEl?.classList.add('checked');
        } else {
            plugin.selected_params = plugin.selected_params.filter(k => k !== paramKey);
            labelEl?.classList.remove('checked');
        }
    }
    
    /**
     * 加载任务已关联的插件
     */
    async function loadTaskPlugins(taskId, taskType) {
        currentTaskType = taskType;
        selectedPlugins = [];
        renderAvailableParams();
        
        if (!taskId) {
            renderPluginList();
            return;
        }
        
        try {
            const response = await fetch(`/api/plugins/task/${taskType}/${taskId}`);
            const result = await response.json();
            
            if (result.code === 200) {
                selectedPlugins = (result.data || []).map(p => ({
                    ...p,
                    selected_params: p.selected_params || DEFAULT_PARAMS
                }));
            }
        } catch (error) {
            console.error('加载任务插件关联失败:', error);
        }
        
        renderPluginList();
    }
    
    /**
     * 保存任务插件关联
     */
    async function saveTaskPlugins(taskId, taskType) {
        if (!taskId) return { success: true };
        
        try {
            const response = await fetch(`/api/plugins/task/${taskType}/${taskId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plugins: selectedPlugins })
            });
            const result = await response.json();
            
            return { success: result.code === 200, message: result.message };
        } catch (error) {
            console.error('保存任务插件关联失败:', error);
            return { success: false, message: error.message };
        }
    }
    
    /**
     * 重置状态
     */
    function reset() {
        selectedPlugins = [];
        renderPluginList();
    }
    
    /**
     * 获取任务类型的参数定义
     */
    function getTaskParams(taskType) {
        return TASK_PARAMS[taskType] || [];
    }
    
    return {
        init,
        loadAvailablePlugins,
        loadTaskPlugins,
        saveTaskPlugins,
        togglePlugin,
        toggleParam,
        getSelectedPlugins: () => selectedPlugins,
        getTaskParams,
        reset
    };
})();
</script>
