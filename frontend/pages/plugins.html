<script>
(function() {
    // 当前配置的插件ID
    let currentConfigPluginId = null;
    let currentConfigSchema = [];

    // 页面加载时获取插件列表和初始化规范内容
    loadPlugins();
    // 立即加载规范内容，避免切换时空白
    setTimeout(function() {
        loadPluginSpec();
    }, 100);
    
    /**
     * 切换标签页
     */
    window.switchTab = function(tab) {
        // 更新导航状态
        document.querySelectorAll('.tab-nav-item').forEach(item => {
            item.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // 切换内容
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        
        if (tab === 'list') {
            document.getElementById('listTab').classList.add('active');
        } else if (tab === 'spec') {
            const specTab = document.getElementById('specTab');
            specTab.classList.add('active');
            // 确保内容已加载
            if (!window.specContentLoaded) {
                loadPluginSpec();
                window.specContentLoaded = true;
            }
        }
    };
    
    /**
     * 加载插件规范内容
     */
    function loadPluginSpec() {
        const specContent = document.getElementById('specContent');
        if (!specContent) {
            console.error('specContent element not found');
            return;
        }
        
        console.log('Loading plugin spec content...');
        
        specContent.innerHTML = `
            <h2>📋 概述</h2>
            <p>T3MT 插件系统允许开发者扩展系统功能，在任务执行完成后自动执行自定义逻辑。本规范介绍如何开发一个标准的 T3MT 插件。</p>
            
            <h2>📁 插件目录结构</h2>
            <pre><code>plugin_name/
├── plugin_meta.json      # 插件元信息（必需）
├── backend/
│   ├── __init__.py
│   └── main.py           # 插件主代码（必需）
└── README.md             # 插件说明（可选）</code></pre>
            
            <h2>📄 元信息文件 (plugin_meta.json)</h2>
            <p>插件元信息文件定义了插件的基本信息和配置项。</p>
            
            <h3>完整示例</h3>
            <pre><code>{
    "plugin_id": "my_plugin",
    "plugin_name": "我的插件",
    "plugin_version": "1.0.0",
    "plugin_author": "作者名",
    "plugin_desc": "插件功能描述",
    "config_schema": [
        {
            "param_key": "api_url",
            "param_name": "API地址",
            "param_type": "string",
            "param_desc": "接口地址，如 https://api.example.com",
            "required": true,
            "default_value": ""
        },
        {
            "param_key": "timeout",
            "param_name": "超时时间(秒)",
            "param_type": "number",
            "param_desc": "请求超时时间",
            "required": false,
            "default_value": 30
        },
        {
            "param_key": "enabled",
            "param_name": "启用通知",
            "param_type": "boolean",
            "param_desc": "是否启用通知功能",
            "required": false,
            "default_value": true
        }
    ]
}</code></pre>
            
            <h3>字段说明</h3>
            <table>
                <thead>
                    <tr>
                        <th>字段</th>
                        <th>类型</th>
                        <th>必需</th>
                        <th>说明</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><code>plugin_id</code></td>
                        <td>string</td>
                        <td>是</td>
                        <td>插件唯一标识，只能包含字母、数字、下划线，必须以字母开头</td>
                    </tr>
                    <tr>
                        <td><code>plugin_name</code></td>
                        <td>string</td>
                        <td>是</td>
                        <td>插件显示名称</td>
                    </tr>
                    <tr>
                        <td><code>plugin_version</code></td>
                        <td>string</td>
                        <td>是</td>
                        <td>版本号，格式为 x.y.z</td>
                    </tr>
                    <tr>
                        <td><code>plugin_author</code></td>
                        <td>string</td>
                        <td>否</td>
                        <td>作者名称</td>
                    </tr>
                    <tr>
                        <td><code>plugin_desc</code></td>
                        <td>string</td>
                        <td>否</td>
                        <td>插件描述</td>
                    </tr>
                    <tr>
                        <td><code>config_schema</code></td>
                        <td>array</td>
                        <td>否</td>
                        <td>配置项定义数组</td>
                    </tr>
                </tbody>
            </table>
            
            <h3>配置项类型 (param_type)</h3>
            <ul>
                <li><code>string</code>: 文本输入框</li>
                <li><code>number</code>: 数字输入框</li>
                <li><code>boolean</code>: 复选框</li>
                <li><code>textarea</code>: 多行文本框</li>
                <li><code>select</code>: 下拉选择框（需配合 options 字段）</li>
            </ul>
            
            <h2>💻 插件主代码 (backend/main.py)</h2>
            <p>插件主代码必须继承 <code>BasePlugin</code> 基类并实现 <code>execute()</code> 方法。</p>
            
            <h3>基础模板</h3>
            <pre><code># -*- coding: utf-8 -*-
"""插件说明"""
from plugins.base_plugin import BasePlugin


class MyPlugin(BasePlugin):
    """我的插件"""
    
    def execute(self) -> bool:
        """
        执行插件逻辑
        
        Returns:
            True 表示执行成功，False 表示执行失败
        """
        # 1. 获取配置
        api_url = self.get_config('api_url', '')
        timeout = self.get_config('timeout', 30)
        
        # 2. 获取任务上下文
        task_name = self.get_task_param('task_name', '')
        status = self.get_task_param('status', '')
        
        # 3. 记录日志
        self.log(f"开始执行插件，任务: {task_name}")
        
        try:
            # 4. 执行你的业务逻辑
            # ...
            
            self.log("执行成功", "success")
            return True
            
        except Exception as e:
            self.log(f"执行失败: {str(e)}", "error")
            return False


def register_plugin():
    """注册插件（供插件管理器调用）"""
    return MyPlugin</code></pre>

"""Webhook 通知插件 - 任务完成后发送 HTTP 请求"""
import requests
from plugins.base_plugin import BasePlugin


class WebhookPlugin(BasePlugin):
    """Webhook 通知插件"""
    
    def execute(self) -> bool:
        """执行 Webhook 通知"""
        # 获取配置
        webhook_url = self.get_config('webhook_url', '')
        timeout = self.get_config('timeout', 30)
        send_on_success = self.get_config('send_on_success', True)
        send_on_failure = self.get_config('send_on_failure', True)
        
        # 验证配置
        if not webhook_url:
            self.log("Webhook URL 未配置", "error")
            return False
        
        # 检查是否需要发送
        status = self.get_task_param('status')
        if status == 'success' and not send_on_success:
            self.log("任务成功，但配置为不发送通知")
            return True
        if status == 'failed' and not send_on_failure:
            self.log("任务失败，但配置为不发送通知")
            return True
        
        # 构建请求数据
        payload = {
            'task_id': self.get_task_param('task_id'),
            'task_name': self.get_task_param('task_name'),
            'task_type': self.get_task_param('task_type'),
            'status': status,
            'start_time': self.get_task_param('start_time'),
            'end_time': self.get_task_param('end_time'),
            'duration': self.format_duration(self.get_task_param('duration', 0)),
            'total_count': self.get_task_param('total_count', 0),
            'success_count': self.get_task_param('success_count', 0),
            'failed_count': self.get_task_param('failed_count', 0),
            'total_size': self.format_size(self.get_task_param('total_size', 0)),
        }
        
        # 添加错误信息（如果有）
        if self.is_task_failed():
            payload['error_message'] = self.get_task_param('error_message', '')
        
        # 发送请求
        try:
            self.log(f"正在发送 Webhook 到: {webhook_url}")
            response = requests.post(
                webhook_url, 
                json=payload, 
                timeout=timeout,
                headers={'Content-Type': 'application/json'}
            )
            response.raise_for_status()
            
            self.log(f"Webhook 发送成功: HTTP {response.status_code}", "success")
            return True
            
        except requests.exceptions.Timeout:
            self.log(f"Webhook 请求超时（{timeout}秒）", "error")
            return False
        except requests.exceptions.RequestException as e:
            self.log(f"Webhook 发送失败: {str(e)}", "error")
            return False
        except Exception as e:
            self.log(f"未知错误: {str(e)}", "error")
            return False


def register_plugin():
    """注册插件"""
    return WebhookPlugin</code></pre>

    /**

     */
    window.exportPlugin = async function(pluginId) {
        try {
            const response = await fetch(`/api/plugins/${pluginId}/export`);
            
            if (response.ok) {
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `${pluginId}.zip`;
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        filename = match[1].replace(/['"]/g, '');
                    }
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showToast('插件导出成功', 'success');
            } else {
                const result = await response.json();
                showToast(result.message || '导出失败', 'error');
            }
        } catch (error) {

    /**

    function renderConfigForm(schema, config) {
        if (!schema || schema.length === 0) {
            return '<div style="text-align: center; color: #999; padding: 20px;">此插件无需配置</div>';
        }
        
        return schema.map(field => {
            const value = config[field.param_key] !== undefined ? config[field.param_key] : (field.default_value || '');
            const required = field.required ? '<span style="color: #ef4444;">*</span>' : '';
            
            let input = '';
            switch (field.param_type) {
                case 'boolean':
                    input = `
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="config_${field.param_key}" ${value ? 'checked' : ''}>
                            <span>${field.param_name}</span>
                        </label>
                    `;
                    break;
                case 'number':
                    input = `<input type="number" id="config_${field.param_key}" value="${value}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">`;
                    break;
                case 'select':
                    const options = field.options || [];
                    input = `
                        <select id="config_${field.param_key}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                            ${options.map(opt => `<option value="${opt.value}" ${value === opt.value ? 'selected' : ''}>${opt.label}</option>`).join('')}
                        </select>
                    `;
                    break;
                default:
                    input = `<input type="text" id="config_${field.param_key}" value="${value}" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">`;
            }
            
            return `
                <div class="form-group" style="margin-bottom: 16px;">
                    ${field.param_type !== 'boolean' ? `<label style="display: block; margin-bottom: 6px; font-weight: 500;">${field.param_name} ${required}</label>` : ''}
                    ${input}
                    ${field.param_desc ? `<div style="font-size: 12px; color: #999; margin-top: 4px;">${field.param_desc}</div>` : ''}
                </div>
            `;
        }).join('');
    }

                hideConfigModal();
            } else {
                showToast(result.message || '保存失败', 'error');
            }
        } catch (error) {
            console.error('保存插件配置失败:', error);
            showToast('保存插件配置失败', 'error');
        }
    };

    /**
     * 显示统计弹窗
     */
    window.showStatsModal = async function(pluginId) {
        try {
            const response = await fetch(`/api/plugins/${pluginId}/stats`);
            const result = await response.json();
            
            if (result.code === 200) {
                const stats = result.data;
                document.getElementById('statsModalTitle').textContent = '执行统计 - ' + pluginId;
                document.getElementById('statsModalBody').innerHTML = `
                    <div style="display: grid; gap: 16px;">
                        <div style="display: flex; justify-content: space-between; padding: 12px; background: #f9fafb; border-radius: 6px;">
                            <span style="color: #666;">总执行次数</span>
                            <span style="font-weight: 600;">${stats.total || 0}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px; background: #d1fae5; border-radius: 6px;">
                            <span style="color: #059669;">成功次数</span>
                            <span style="font-weight: 600; color: #059669;">${stats.success_count || 0}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px; background: #fee2e2; border-radius: 6px;">
                            <span style="color: #dc2626;">失败次数</span>
                            <span style="font-weight: 600; color: #dc2626;">${stats.failed_count || 0}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 12px; background: #f9fafb; border-radius: 6px;">
                            <span style="color: #666;">平均耗时</span>
                            <span style="font-weight: 600;">${stats.avg_duration ? Math.round(stats.avg_duration) + ' ms' : '-'}</span>
                        </div>
                    </div>
                `;
                document.getElementById('statsModal').style.display = 'flex';
            } else {
                showToast(result.message || '获取统计失败', 'error');
            }
        } catch (error) {
            console.error('获取插件统计失败:', error);
            showToast('获取插件统计失败', 'error');
        }
    };

    /**
     * 隐藏统计弹窗
     */
    window.hideStatsModal = function() {
        document.getElementById('statsModal').style.display = 'none';
    };

    /**
     * 显示提示消息
     */
    function showToast(message, type = 'info') {
        if (window.parent && window.parent.showToast) {
            window.parent.showToast(message, type);
        } else if (typeof window.showGlobalToast === 'function') {
            window.showGlobalToast(message, type);
        } else {
            alert(message);
        }
    }
})();
</script>
