version: '3.8'

services:
  t3mt-test:
    image: 85423296/t3mt:test
    container_name: t3mt-test
    restart: unless-stopped
    ports:
      - "8521:80"  # 使用不同端口避免与稳定版冲突
    volumes:
      - ./data-test:/app/backend/data
      - ./logs-test:/app/backend/logs
      - ./downloads-test:/app/backend/downloads
    environment:
      - TZ=Asia/Shanghai
