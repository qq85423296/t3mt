name: Build and Push Docker Image

on:
  push:
    branches:
      - main    # 稳定版分支
      - test    # 测试版分支
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - 'supervisord.conf'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # 根据分支确定镜像标签
      - name: 确定镜像标签
        id: tags
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # 稳定版: latest + 版本号
            echo "tags=85423296/t3mt:latest,85423296/t3mt:2.1.4" >> $GITHUB_OUTPUT
            echo "version=稳定版 (latest, 2.1.4)" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/test" ]; then
            # 测试版: test
            echo "tags=85423296/t3mt:test" >> $GITHUB_OUTPUT
            echo "version=测试版 (test)" >> $GITHUB_OUTPUT
          else
            echo "tags=85423296/t3mt:dev" >> $GITHUB_OUTPUT
            echo "version=开发版 (dev)" >> $GITHUB_OUTPUT
          fi
      
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 构建并推送镜像完成
        run: |
          echo "✅ Docker 镜像构建并推送成功"
          echo "分支: ${{ github.ref_name }}"
          echo "版本: ${{ steps.tags.outputs.version }}"
          echo "镜像标签: ${{ steps.tags.outputs.tags }}"
